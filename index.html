<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style id="arenaCss">:root{
  --midnight:#0B0F1F; --cabinet:#1A1430; --cab2:#241C42; --gold:#F2B441; --emerald:#4DE0B1;
  --crimson:#FF4D9D; --parch:#EFEAFB; --muted:#A79FC7; --line:#3A2F66; --sky:#62B6FF;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.45);
  --fd:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --fb:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--midnight);color:var(--parch);font-family:var(--fb);font-size:16px;line-height:1.45}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1f55 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#13304a 0,transparent 60%),var(--midnight);min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--parch);background:#120e24;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem}
textarea{width:100%;min-height:140px;resize:vertical}
a{color:var(--emerald)}
h1,h2,h3{font-family:var(--fd);font-weight:400;letter-spacing:.5px;margin:.2em 0 .5em}
h1{font-size:1.6rem} h2{font-size:1.3rem;color:var(--gold)} h3{font-size:1.05rem}
.small{font-size:.85rem;color:var(--muted)} .muted{color:var(--muted)}
.hide{display:none!important}

/* top bar */
#topbar{position:sticky;top:0;z-index:30;background:rgba(11,15,31,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.55rem;font-family:var(--fd);font-size:1.05rem;color:var(--gold);white-space:nowrap}
.logo .av{width:38px;height:38px;border-radius:10px;overflow:hidden;background:var(--cabinet);border:2px solid var(--gold);flex:none}
.logo .av img,.logo .av svg{width:100%;height:100%;object-fit:cover;display:block}
.roles{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}
.role{background:var(--cabinet);border:1px solid var(--line);border-radius:999px;padding:.4rem .8rem;font-size:.9rem}
.role.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
.tools{display:flex;gap:.3rem}
.iconbtn{background:var(--cabinet);border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem;min-width:40px}
.iconbtn.on{border-color:var(--emerald);color:var(--emerald)}
.hud{display:flex;gap:.4rem;padding:.4rem .9rem .6rem;flex-wrap:wrap;align-items:center}
.chip{background:var(--cabinet);border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;font-size:.85rem;display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.chip b{color:var(--gold)}
.meter{width:90px;height:8px;background:#0c0918;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold))}
.coin{display:inline-block;width:18px;height:18px;vertical-align:-3px}
.coin img,.coin svg{width:100%;height:100%}

main{max-width:1180px;margin:0 auto;padding:1rem .9rem 4rem}
.card{background:linear-gradient(180deg,var(--cabinet),#150f29);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.btn{background:var(--cab2);border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.em{background:var(--emerald);color:#04241a;border-color:var(--emerald)}
.btn.cr{background:var(--crimson);color:#2a0016;border-color:var(--crimson)}
.btn.ghost{background:transparent}
.btn.big{font-size:1.1rem;padding:.85rem 1.3rem}
.back{background:none;border:none;color:var(--muted);padding:.2rem 0;margin-bottom:.4rem}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.4px;padding:.15rem .5rem;border-radius:6px;background:#0f0b20;border:1px solid var(--line);color:var(--muted);font-weight:700}
.tag.gold{color:var(--gold);border-color:#6b5320}.tag.em{color:var(--emerald);border-color:#1d6b55}.tag.cr{color:var(--crimson);border-color:#6b2048}

/* unit picker */
.unit{cursor:pointer;text-align:left;border:2px solid var(--line);transition:.15s}
.unit:hover{transform:translateY(-2px);border-color:var(--gold)}
.unit.on{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(77,224,177,.2),var(--shadow)}
.unit .ico{font-size:1.8rem}
.mode{cursor:pointer;text-align:left;border:2px solid var(--line);display:flex;flex-direction:column;gap:.35rem;min-height:150px}
.mode:hover{border-color:var(--gold);transform:translateY(-2px)}
.mode .ico{font-size:2rem}
.mode.locked{opacity:.6}
.timeline{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 .6rem}
.tl{flex:none;width:170px;background:#120e24;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:.5rem .6rem;font-size:.85rem}
.tl b{font-family:var(--fd);color:var(--gold);font-weight:400}
.bmbar{display:grid;grid-template-columns:130px 1fr 44px;gap:.5rem;align-items:center;font-size:.82rem;margin:.25rem 0}
.bmbar .meter{width:100%}

/* question engine */
.qwrap{max-width:860px;margin:0 auto}
.stim{background:#efe6cf;color:#2b2010;border-radius:12px;padding:.9rem 1rem;font-family:Georgia,'Times New Roman',serif;font-size:1.02rem;border-left:6px solid #9c7a3a;margin-bottom:.8rem}
.stem{font-size:1.2rem;font-weight:700;margin:.4rem 0 .9rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;background:#140f2a;border:2px solid var(--line);border-radius:12px;padding:.75rem .9rem;font-size:1.02rem;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--sky);background:#1a1438}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--cab2);font-family:var(--fd);font-size:.85rem;color:var(--gold)}
.opt.right{border-color:var(--emerald);background:#0f2a24}
.opt.wrong{border-color:var(--crimson);background:#2a0f20}
.opt.gone{opacity:.25;text-decoration:line-through}
.pubar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.pu{display:flex;align-items:center;gap:.35rem;background:#120e24;border:1px solid var(--line);border-radius:10px;padding:.35rem .6rem;font-size:.85rem}
.pu .pi{width:24px;height:24px}
.pu .pi img,.pu .pi svg{width:100%;height:100%}
.pu.armed{border-color:var(--emerald);box-shadow:0 0 0 2px rgba(77,224,177,.3)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.timer{height:6px;background:#0c0918;border-radius:99px;overflow:hidden;margin:.3rem 0 .7rem}
.timer i{display:block;height:100%;background:var(--sky);transition:width 1s linear}
.diag{border:2px solid var(--crimson);border-radius:14px;padding:1rem;background:#1d0b1a;margin-top:.8rem}
.diag h3{color:var(--crimson)}
.reteach{background:#0e1f2c;border:2px solid var(--sky);border-radius:14px;padding:1rem;margin-top:.7rem}
.reteach h3{color:var(--sky)}
.lockbar{position:relative;height:30px;background:#0c0918;border-radius:10px;overflow:hidden;margin-top:.8rem;border:1px solid var(--line)}
.lockbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--crimson),var(--gold));transition:width .1s linear}
.lockbar span{position:relative;display:block;text-align:center;line-height:30px;font-weight:700;font-size:.9rem}
.good{border:2px solid var(--emerald);border-radius:14px;padding:.9rem;background:#0b2620;margin-top:.8rem}
.good h3{color:var(--emerald)}
.progress{height:12px;background:#0c0918;border-radius:99px;overflow:visible;position:relative;margin:.3rem 0 1rem}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
.progress .thr{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--crimson)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,14,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:linear-gradient(180deg,var(--cabinet),#130e26);border:2px solid var(--gold);border-radius:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:1.2rem;box-shadow:var(--shadow);position:relative}
.modal.full{max-width:none;height:94vh;max-height:none}
.modal .x{position:absolute;top:.6rem;right:.6rem}

/* flashcards */
.flip{perspective:1000px;height:240px;cursor:pointer;max-width:560px;margin:0 auto}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.2rem;text-align:center;border:2px solid var(--gold)}
.flip .f{background:var(--cab2);font-family:var(--fd);font-size:1.5rem;color:var(--gold)}
.flip .b{background:#0f2a24;transform:rotateY(180deg);border-color:var(--emerald)}

/* jeopardy */
.jboard{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
.jcat{background:#1b1660;border-radius:10px;padding:.6rem .3rem;text-align:center;font-family:var(--fd);font-size:.85rem;min-height:64px;display:grid;place-items:center;color:#fff}
.jtile{background:#1d1a7a;border:none;border-radius:10px;font-family:var(--fd);font-size:1.6rem;color:var(--gold);min-height:74px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.jtile:hover:not(:disabled){background:#2a25a8}
.jtile.used{background:#0f0d33;color:transparent}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-top:.8rem}
.team{background:var(--cabinet);border:2px solid var(--line);border-radius:12px;padding:.5rem;text-align:center}
.team .sc{font-family:var(--fd);font-size:1.5rem;color:var(--gold)}
.team .sc.neg{color:var(--crimson)}
.team.lead{border-color:var(--gold)}
.clue{font-family:var(--fd);font-size:clamp(1.4rem,3.2vw,2.6rem);line-height:1.3;text-align:center;color:#fff;padding:1.2rem .5rem}
.jblue{background:#14127a!important;border-color:#2a25a8!important}

/* gallery */
.hall{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);min-height:150px}
.hall .bg{position:absolute;inset:0}
.hall .bg img,.hall .bg svg{width:100%;height:100%;object-fit:cover}
.doors{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;padding:1rem}
.door{background:rgba(26,20,48,.9);border:2px solid var(--line);border-radius:14px 14px 4px 4px;padding:.8rem .5rem;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.door.open{border-color:var(--gold)} .door.done{border-color:var(--emerald)}
.exhibit{background:#2b1d0e;border:10px solid #b88a3c;outline:3px solid #6e4c18;border-radius:6px;padding:1.1rem;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.5)}
.exhibit .paper{background:#f1e7cc;color:#2a1d0c;padding:1rem 1.1rem;border-radius:4px;font-family:Georgia,serif;font-size:1.05rem}
.plaque{background:#1a1208;color:#e8d3a2;border:1px solid #6e4c18;padding:.45rem .7rem;margin-top:.7rem;font-size:.85rem;border-radius:4px}
.hs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.hsb{background:#e8d3a2;color:#2a1d0c;border:2px solid #6e4c18;border-radius:999px;padding:.35rem .7rem;font-weight:700}
.hsb.seen{background:#4DE0B1;border-color:#1d6b55}
.hsb.sel{outline:3px solid var(--gold)}
.note{background:#fff6dc;color:#2a1d0c;border-left:5px solid #b88a3c;padding:.6rem .8rem;margin-top:.6rem;border-radius:6px}
.steps{display:flex;gap:.4rem;margin-bottom:.6rem}
.step{flex:1;text-align:center;font-size:.78rem;padding:.35rem;border-radius:8px;background:#120e24;border:1px solid var(--line)}
.step.on{border-color:var(--gold);color:var(--gold)} .step.ok{border-color:var(--emerald);color:var(--emerald)}

/* summit */
.mtn{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);aspect-ratio:16/7;background:#0f1530}
.mtn svg.trail,.mtn .bg{position:absolute;inset:0;width:100%;height:100%}
.mtn .bg img,.mtn .bg svg{width:100%;height:100%;object-fit:cover}
.climber{position:absolute;width:44px;height:44px;transform:translate(-50%,-90%);transition:left .8s ease,top .8s ease;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.climber img,.climber svg{width:100%;height:100%}
.rock{position:absolute;font-size:2rem;transform:translate(-50%,-120%)}

/* arcade */
.cab{border:3px solid var(--crimson);background:linear-gradient(180deg,#2a0f3a,#130a22);text-align:center}
.cab h3{color:var(--crimson)}
canvas.game{width:100%;max-width:900px;display:block;margin:0 auto;border-radius:12px;border:3px solid var(--gold);background:#070a18;touch-action:manipulation}

/* tables & studio */
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
th{background:#120e24;color:var(--gold);font-weight:700}
.heat td{text-align:center;font-weight:700;font-size:.78rem;padding:.3rem .2rem;color:#0b0f1f}
.drop{border:3px dashed var(--line);border-radius:16px;padding:1.5rem;text-align:center;background:#100c20}
.drop.over{border-color:var(--emerald);background:#0b2620}
.field{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem}
.field label{color:var(--muted);font-weight:700}
.kw{display:inline-block;margin:.15rem;padding:.2rem .55rem;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.kw.hit{border-color:var(--emerald);color:var(--emerald);background:#0b2620}
.asset{display:flex;flex-direction:column;gap:.4rem}
.asset .pv{height:120px;border-radius:10px;background:#0c0918;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.asset .pv img,.asset .pv svg{max-width:100%;max-height:100%}
details{background:#120e24;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin:.4rem 0}
summary{cursor:pointer;font-weight:700}
.ok{color:var(--emerald)} .bad{color:var(--crimson)} .gold{color:var(--gold)}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;font-weight:700;padding:.6rem 1rem;border-radius:12px;z-index:200;box-shadow:var(--shadow);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}

/* report */
.report{background:#fff;color:#111;border-radius:10px;padding:1.4rem;font-family:Georgia,serif}
.report h1{font-family:Georgia,serif;font-weight:700;color:#111;font-size:1.4rem;margin:0}
.report table th{background:#eee;color:#111}.report td,.report th{border-color:#bbb}
.report .hash{font-family:monospace;font-size:1.1rem;background:#f3f3f3;padding:.2rem .5rem;border-radius:4px}

/* tour */
.tour-shield{position:fixed;inset:0;z-index:298}
.tour-hole{position:fixed;z-index:299;border-radius:14px;border:3px solid var(--gold);box-shadow:0 0 0 9999px rgba(5,6,14,.78);pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:300;width:min(380px,calc(100vw - 24px));background:linear-gradient(180deg,var(--cab2),var(--cabinet));border:2px solid var(--gold);border-radius:16px;padding:1rem;box-shadow:var(--shadow)}
@media (max-width:700px){
  #topbar{position:static}
  .roles{margin-left:0;width:100%} .role{flex:1;font-size:.78rem;padding:.4rem .4rem}
  .jcat{font-size:.6rem;min-height:52px}.jtile{font-size:1rem;min-height:54px}
  .bmbar{grid-template-columns:96px 1fr 40px}
  h1{font-size:1.25rem}
}
@media print{
  body{background:#fff} #topbar,.noprint,.modal-bg>.modal>.x{display:none!important}
  .modal-bg{position:static;background:none;padding:0}.modal{border:none;box-shadow:none;max-height:none;background:#fff}
  main{display:none}
}
</style></head>

   jp: { cats:[5], c:[ [ [clue, answer] x5 ] x5 ], fj:[category, clue, answer] }

const FLORIDA_US_HISTORY_DB = [];

FLORIDA_US_HISTORY_DB.push({

    clar: 'Students distinguish the freedoms guaranteed by each Reconstruction Amendment, assess how Jim Crow laws and the Nadir affected African Americans, and compare federal and state actions after 1865.',

    ['1887','Dawes Act divides reservation land'],

    ['1896','Plessy v. Ferguson upholds "separate but equal"'],

  ],
  brief: {
    causes: 'Decades of conflict over slavery\'s expansion into western territories (Missouri Compromise, Compromise of 1850, Kansas-Nebraska Act, Dred Scott) broke the Union apart after Abraham Lincoln\'s 1860 election. Eleven Southern states seceded to protect slavery.',
    course: 'The Union\'s industrial and population advantages, the Anaconda Plan blockade, and turning points such as Antietam, Gettysburg and Vicksburg wore down the Confederacy. The Emancipation Proclamation (1863) made ending slavery a war aim and allowed nearly 200,000 Black men to serve in the Union army and navy.',
    consequences: 'Reconstruction (1865–1877) added the 13th, 14th and 15th Amendments, but Presidential Reconstruction under Andrew Johnson allowed Black Codes. Radical Republicans imposed military Reconstruction, and Black men won office across the South. After the Compromise of 1877 removed federal troops, Southern "Redeemers" built Jim Crow segregation, disfranchisement, sharecropping and debt peonage. The Supreme Court\'s Plessy v. Ferguson (1896) approved "separate but equal." In the West, federal policy (reservations, the Dawes Act, boarding schools) aimed to assimilate Native nations and took most tribal land.',

  },

    gem:`${GEM_STYLE} Scene: enormous money-bag giants labeled "OIL TRUST", "STEEL TRUST", "SUGAR TRUST" loom over tiny lawmakers at desks; a door labeled "PEOPLE'S ENTRANCE — CLOSED"; caption: "WHO RUNS THE SENATE?".` },
  { t:'Haymarket Broadside', src:'Handbill, Chicago, May 4, 1886', kind:'Document', verbatim:true, q:4,
    ex:'"Attention Workingmen! Great Mass Meeting To-Night, at 7.30 o\'clock, HAYMARKET... Good Speakers will be present to denounce the latest atrocious act of the police, the shooting of our fellow-workmen yesterday afternoon."',
    hs:[['"the shooting... yesterday"','Police had killed strikers at the McCormick Harvester plant on May 3 during the eight-hour-day movement.'],['Haymarket Square','A bomb killed police officers at the rally; eight anarchists were convicted with thin evidence.'],['Aftermath','The public blamed organized labor; the Knights of Labor declined and the AFL grew.']],
    hp:['Intended audience: Who was this handbill written for?','Chicago workers supporting the eight-hour day','Factory owners','Federal judges'],
    ev:['Click the hotspot explaining why the Knights of Labor declined.',2], link:LOC('Haymarket 1886 handbill'),
    gem:`${GEM_DOC} Scene: a torn 1886 street handbill pasted on a brick wall at night under a gas lamp; title: "ATTENTION WORKINGMEN!".` },
  { t:'"The Tammany Tiger Loose"', src:'Thomas Nast, Harper\'s Weekly, November 11, 1871', kind:'Political Cartoon', verbatim:false, q:7,
    ex:'In a Roman-style arena, a tiger wearing a collar marked "Tammany" mauls a fallen woman representing Columbia (the American republic). From the imperial box, "Boss" William Tweed and his ring watch like emperors. The caption asks: "What are you going to do about it?" — words attributed to Tweed.',
    hs:[['The Tammany tiger','The tiger was Tammany Hall, New York\'s Democratic political machine, which traded jobs and favors for votes.'],['Columbia on the ground','The republic — honest government and the public treasury — destroyed by graft.'],['"What are you going to do about it?"','Tweed\'s supposed taunt to reformers. Nast\'s cartoons helped turn voters against him; Tweed was convicted in 1873.']],
    hp:['Purpose: What did Nast want readers to do?','Vote out Tammany Hall and support reform','Join the Tammany political machine','Visit a Roman arena'],
    ev:['Click the hotspot showing the boss\'s attitude toward reformers.',2], link:LOC('Nast Tammany tiger loose 1871'),
    gem:`${GEM_STYLE} Scene: a tiger labeled "POLITICAL MACHINE" prowls over scattered ballots and coins labeled "CITY TREASURY", while a top-hatted boss figure labeled "THE BOSS" smirks from a balcony; caption: "WHAT ARE YOU GOING TO DO ABOUT IT?".` },
  { t:'"The Chinese Question"', src:'Thomas Nast, Harper\'s Weekly, February 18, 1871', kind:'Political Cartoon', verbatim:false, q:5,
    ex:'Columbia stands between a Chinese immigrant, seated against a wall, and an angry mob. Posters on the wall carry slurs used against Chinese workers. Columbia tells the mob: "Hands off, gentlemen! America means fair play for all men."',
    hs:[['Columbia protecting the immigrant','Nast argues the nation\'s ideals require equal treatment for Chinese immigrants.'],['The posters and the mob','West Coast workers blamed Chinese laborers for low wages; anti-Chinese violence and laws followed.'],['"Fair play for all men"','Congress went the other way: the Chinese Exclusion Act (1882) was the first major law barring immigrants by nationality.']],
    hp:['Historical situation: Why were Chinese immigrants targeted in the West in the 1870s?','Workers blamed them for low wages during economic hard times','They controlled the federal government','They refused to work on railroads'],
    ev:['Click the hotspot that connects to the Chinese Exclusion Act.',2], link:LOC('Nast Chinese question 1871 Columbia'),
    gem:`${GEM_STYLE} Scene: Columbia in a starred gown shields a railroad worker from a crowd holding signs labeled "EXCLUSION"; a wall poster reads "WORKERS WANTED"; caption: "FAIR PLAY FOR ALL?".` }
],
u3: [
  { t:'Remember the Maine!', src:'New York Journal headline, February 17, 1898', kind:'Document', verbatim:true, q:3,
    ex:'"DESTRUCTION OF THE WAR SHIP MAINE WAS THE WORK OF AN ENEMY" — printed two days after the explosion, before any investigation was complete.',
    hs:[['"WORK OF AN ENEMY"','No evidence existed yet; later studies suggest an accidental internal explosion was likely.'],['New York Journal','William Randolph Hearst\'s paper competed with Pulitzer\'s World for readers through sensational stories.'],['Two days later','Speed over accuracy: the hallmark of yellow journalism.']],
    hp:['Purpose: What did the newspaper most want readers to feel?','Outrage at Spain that would build support for war','Calm patience while investigators worked','Sympathy for the Spanish navy'],
    ev:['Click the hotspot showing what investigators later suggested.',0], link:LOC('New York Journal Maine 1898'),
    gem:`${GEM_STYLE} Scene: two newsboys labeled "YELLOW PRESS" shout over each other holding giant headlines "WAR!" while a sunken battleship labeled "MAINE" smokes in a harbor; caption: "EXTRA! EXTRA! — 1898".` },
  { t:'"With All, and for the Good of All"', src:'José Martí, speech at the Liceo Cubano, Ybor City (Tampa), November 26, 1891', kind:'Document', verbatim:true, q:4,
    ex:'Speaking to Cuban cigar workers in Tampa, Martí closed by proposing the founding principle of a free Cuba: "Con todos, y para el bien de todos" — "With all, and for the good of all."',
    hs:[['Ybor City cigar workers','Cuban workers in Tampa and Key West donated part of their wages to Martí\'s Cuban Revolutionary Party.'],['Tampa','Seven years later, Henry Plant\'s railroad and port made Tampa the main embarkation point for U.S. troops invading Cuba (1898).'],['"With all"','Martí imagined an independent republic for Black and white Cubans alike — not rule by Spain or by the United States.']],
    hp:['Intended audience: Who was Martí speaking to?','Cuban cigar workers in Tampa\'s Ybor City','U.S. Army officers','The Spanish government'],
    ev:['Click the hotspot that shows how Florida workers funded Cuban independence.',0], link:LOC('Jose Marti Tampa Ybor City'),
    gem:`Warm 1890s illustration of a crowded cigar-factory hall in Ybor City, Tampa: workers at long tables rolling cigars, a lector reading aloud from a raised platform, Cuban flags and Florida palms through tall windows, sepia tones, 4:3 landscape, no real person's likeness, text-free.` },
  { t:'"School Begins"', src:'Louis Dalrymple, Puck, January 25, 1899', kind:'Political Cartoon', verbatim:false, q:2,
    ex:'Uncle Sam, as a stern schoolteacher, faces four new pupils labeled Philippines, Hawaii, Porto Rico and Cuba, while students labeled with U.S. states read quietly behind them. A Native American boy sits apart, a Black boy washes windows, and a Chinese boy waits at the door. The blackboard argues that the "consent of the governed" is good in theory but rare in fact, and that the U.S. must govern its new territories "with or without their consent until they can govern themselves."',
    hs:[['The four new pupils','The territories gained in 1898 (and Cuba as a protectorate) — the motives of acquisition in SS.912.A.4.2.'],['The blackboard','The cartoon\'s justification for empire contradicts the Declaration of Independence\'s "consent of the governed."'],['Students left out','Native, Black and Chinese figures show the racial hierarchy many imperialists assumed — read the cartoon critically for its attitudes.']],
    hp:['Point of view: What attitude toward the new territories does the cartoon express?','That the U.S. should rule them paternalistically until it judges them ready to govern themselves','That they should immediately become independent nations','That the U.S. should give them back to Spain'],
    ev:['Click the hotspot that contradicts the Declaration of Independence.',1], link:LOC('School begins Puck 1899 Dalrymple'),
    gem:`${GEM_STYLE} Scene: Uncle Sam as a stern teacher at a chalkboard reading "CONSENT OF THE GOVERNED?", facing new desks labeled "PHILIPPINES", "PUERTO RICO", "GUAM" and "HAWAII"; caption: "THE NEW EMPIRE — 1899". Respectful, non-stereotyped figures.` },
  { t:'The Roosevelt Corollary', src:'Theodore Roosevelt, Annual Message to Congress, 1904', kind:'Document', verbatim:true, q:5,
    ex:'"Chronic wrongdoing... may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."',
    hs:[['"Monroe Doctrine"','The 1823 doctrine warned Europe away; Roosevelt added a U.S. right to intervene.'],['"international police power"','Used to justify intervention in the Dominican Republic, Nicaragua and Haiti.'],['"civilized nation"','Language reflecting Social Darwinist ideas of the era.']],
    hp:['Point of view: How did Roosevelt see the role of the U.S. in Latin America?','As a regional police force with the right to intervene','As a neutral observer that should never act','As a colony of Spain'],
    ev:['Click the hotspot showing how this changed an earlier U.S. policy.',0], link:LOC('Roosevelt big stick Caribbean cartoon'),
    gem:`${GEM_STYLE} Scene: a giant figure in a campaign hat labeled "U.S. POLICE POWER" wades through the Caribbean Sea carrying an enormous club labeled "BIG STICK", towing small ships labeled "DEBT COLLECTOR"; caption: "SPEAK SOFTLY... — 1904".` },
  { t:'"Next!"', src:'Udo J. Keppler, Puck, September 7, 1904', kind:'Political Cartoon', verbatim:false, q:0,
    ex:'A giant octopus labeled "Standard Oil" wraps its tentacles around the U.S. Capitol, a state house, the steel, copper and shipping industries — and reaches toward the White House. The title asks who will be "Next!"',
    hs:[['The octopus','A favorite symbol for monopolies: one company reaching into every part of the economy and government.'],['Tentacles on the Capitol','The charge that Standard Oil money controlled lawmakers.'],['1904','The same year Ida Tarbell\'s muckraking History of the Standard Oil Company was published; the Supreme Court broke up Standard Oil in 1911.']],
    hp:['Purpose: What did the cartoonist want readers to fear?','That a monopoly was taking over the government itself','That oil was running out','That the octopus would invade from the sea'],
    ev:['Click the hotspot that connects to a muckraking journalist.',2], link:LOC('Next Keppler Standard Oil octopus 1904'),
    gem:`${GEM_STYLE} Scene: a giant octopus labeled "MONOPOLY" wraps tentacles around a capitol dome labeled "CONGRESS" and factories labeled "STEEL", "RAILROADS"; a muckraking reporter labeled "THE PRESS" shines a lantern on it; caption: "WHO IS NEXT?".` },
  { t:'The Zimmermann Telegram', src:'German Foreign Secretary Arthur Zimmermann to the German minister in Mexico, January 1917 (English translation)', kind:'Document', verbatim:true, q:6,
    ex:'"We intend to begin on the first of February unrestricted submarine warfare... We make Mexico a proposal of alliance on the following basis: make war together, make peace together, generous financial support and an understanding on our part that Mexico is to reconquer the lost territory in Texas, New Mexico, and Arizona."',
    hs:[['"unrestricted submarine warfare"','Germany would sink ships without warning — including American ones.'],['"proposal of alliance"','A direct threat to U.S. security on its southern border.'],['"Texas, New Mexico, and Arizona"','The promise of lost land enraged Americans when the British released the decoded message.']],
    hp:['Historical situation: How did Americans learn about this message?','British intelligence intercepted, decoded and shared it','Mexico published it in newspapers','Germany announced it in Congress'],
    ev:['Click the hotspot that shows the threat to American shipping.',0], link:LOCT('Zimmermann Telegram 1917'),
    gem:`${GEM_STYLE} Scene: a spiked German helmet figure secretly slides a telegram labeled "ALLIANCE?" across a map toward Mexico while a British codebreaker labeled "ROOM 40" reads over his shoulder; caption: "DECODED — 1917".` },
  { t:'"I Want YOU for U.S. Army"', src:'James Montgomery Flagg, recruiting poster, 1917', kind:'Poster', verbatim:true, q:7,
    ex:'Uncle Sam, in a top hat with stars, points directly at the viewer above the words: "I WANT YOU FOR U.S. ARMY — NEAREST RECRUITING STATION."',
    hs:[['The pointing finger','Direct address made every viewer feel personally called to serve.'],['Mass printing','Millions of copies were printed during 1917–18 — propaganda on a scale never seen before.'],['Government war measures','Posters worked alongside the Selective Service Act (draft) and the Committee on Public Information to mobilize the nation.']],
    hp:['Purpose: What was this poster designed to do?','Build support for military enlistment during WWI','Advertise a political candidate','Protest the war'],
    ev:['Click the hotspot that connects the poster to government war measures.',2], link:LOC('I want you for U.S. Army Flagg 1917'),
    gem:`Original WWI-style recruiting poster in bold lithograph colors: a determined figure of Columbia in a starred cap points at the viewer; headline "YOUR COUNTRY CALLS — 1917"; 3:4 portrait; not a copy of any existing poster.` },
  { t:'"The Gap in the Bridge"', src:'Leonard Raven-Hill, Punch (London), December 10, 1919', kind:'Political Cartoon', verbatim:false, q:8,
    ex:'A stone bridge labeled "League of Nations" spans a river, but the keystone in the center — labeled "U.S.A." — is missing and leans against the side. Uncle Sam lounges nearby, smoking a pipe. The caption notes: "This bridge was designed by the President of the U.S.A."',
    hs:[['The missing keystone','Without the United States, the League lacked its most powerful member.'],['"Designed by the President of the U.S.A."','Woodrow Wilson proposed the League in his Fourteen Points — but his own Senate rejected it.'],['Uncle Sam relaxing','A British view: America was retreating into isolation after the war.']],
    hp:['Point of view: How did this British cartoonist view U.S. policy?','As irresponsible — the U.S. designed the League and then refused to join it','As heroic leadership of the League','As proof the League would succeed without America'],
    ev:['Click the hotspot that explains why the bridge cannot stand.',0], link:LOC('Gap in the bridge League of Nations Punch 1919'),
    gem:`${GEM_STYLE} Scene: an unfinished arched bridge labeled "LEAGUE OF NATIONS" with a missing center keystone labeled "U.S." resting on the riverbank while a figure in a striped top hat naps under a tree; caption: "THE MISSING PIECE — 1919".` }
],
u4: [
  { t:'A Return to Normalcy', src:'Warren G. Harding, Boston, May 1920', kind:'Document', verbatim:true, q:0,
    ex:'"America\'s present need is not heroics, but healing; not nostrums, but normalcy; not revolution, but restoration."',
    hs:[['"not heroics, but healing"','After WWI and the flu pandemic, many voters were weary of crusades abroad and at home.'],['"not revolution"','A nod to Red Scare fears of communism and radical unrest.'],['Result','Harding won the 1920 election in a landslide; pro-business policies followed.']],
    hp:['Historical situation: Why did "normalcy" appeal to voters in 1920?','They were exhausted by war, strikes and the Red Scare','They wanted to join the League of Nations','They wanted more Progressive regulation'],
    ev:['Click the hotspot connecting the speech to fears of communism.',1], link:LOC('Red Scare cartoon 1919'),
    gem:`${GEM_STYLE} Scene: a tired Uncle Sam steps off a ship labeled "WORLD WAR" onto a dock labeled "NORMALCY" while shadowy figures labeled "STRIKES" and "RED SCARE" loom; caption: "BACK TO NORMAL? — 1920".` },
  { t:'The Eighteenth Amendment', src:'U.S. Constitution, Amendment XVIII, Section 1 (ratified 1919)', kind:'Document', verbatim:true, q:2,
    ex:'"After one year from the ratification of this article the manufacture, sale, or transportation of intoxicating liquors within, the importation thereof into, or the exportation thereof from the United States and all territory subject to the jurisdiction thereof for beverage purposes is hereby prohibited."',
    hs:[['"manufacture, sale, or transportation"','Drinking itself was not banned — making and selling alcohol was. Enforcement came through the Volstead Act.'],['Unintended consequences','Speakeasies, bootlegging and organized crime (Al Capone) flourished.'],['Repeal','The 21st Amendment (1933) repealed Prohibition — the only amendment ever repealed.']],
    hp:['Historical situation: Which movement pushed for this amendment?','The temperance movement, led by groups like the Anti-Saloon League and WCTU','The labor movement','The Populist Party'],
    ev:['Click the hotspot that names an unintended consequence.',1], link:LOC('Prohibition cartoon 1920s'),
    gem:`${GEM_STYLE} Scene: a grim figure in black labeled "PROHIBITION" stands guard at a barred door labeled "SALOON — CLOSED", while a sly figure labeled "BOOTLEGGER" slips crates labeled "SPEAKEASY" through a back alley; caption: "THE NOBLE EXPERIMENT — 1920s".` },
  { t:'"Mr. Dry"', src:'Rollin Kirby, New York World, 1920s', kind:'Political Cartoon', verbatim:false, q:2,
    ex:'Kirby\'s recurring character "Mr. Dry" is a gaunt, gloomy man in a black suit and tall black hat, often carrying an umbrella — a sour, hypocritical enforcer of Prohibition. Kirby, who won the first Pulitzer Prize for editorial cartooning (1922), used him to mock the "dry" crusaders.',
    hs:[['The black suit and hat','Kirby drew Prohibition supporters as joyless puritans — a clear "wet" point of view.'],['Recurring character','Like Uncle Sam, a repeating symbol lets readers recognize the argument instantly.'],['Cultural conflict','Prohibition split the country: rural, Protestant "drys" vs. urban, immigrant "wets" (SS.912.A.5.6).']],
    hp:['Point of view: Did Kirby support or oppose Prohibition?','He opposed it, mocking "dry" crusaders as joyless hypocrites','He strongly supported it','He was neutral'],
    ev:['Click the hotspot that explains which Americans were divided.',2], link:LOC('Rollin Kirby Mr. Dry'),
    gem:`${GEM_STYLE} Scene: a tall gloomy figure in a black suit and stovepipe hat labeled "MR. DRY" frowns at a jazz band and dancing couples labeled "THE ROARING TWENTIES"; caption: "WET vs. DRY — 1920s". Original character design.` },
  { t:'Two Paths: Washington and Du Bois', src:'Booker T. Washington, Atlanta, 1895 · W.E.B. Du Bois, The Souls of Black Folk, 1903', kind:'Document', verbatim:true, q:8,
    ex:'WASHINGTON: "In all things that are purely social we can be as separate as the fingers, yet one as the hand in all things essential to mutual progress."\nDU BOIS: "The problem of the twentieth century is the problem of the color-line."',
    hs:[['"as separate as the fingers"','Washington appeared to accept social segregation while pursuing economic progress through vocational training (Tuskegee).'],['"the problem of the color-line"','Du Bois rejected accommodation and demanded full civil and political rights; he helped found the NAACP (1909).'],['And Marcus Garvey?','In the 1910s–20s Garvey\'s UNIA promoted Black pride, Black-owned business and a Back-to-Africa movement — a third path.']],
    hp:['Point of view: How did Du Bois\'s view differ from Washington\'s?','Du Bois demanded immediate equal rights; Washington emphasized economic progress first','Du Bois supported accepting segregation','They held identical views'],
    ev:['Click the hotspot describing a THIRD leader\'s strategy.',2], link:LOC('Booker T. Washington W.E.B. Du Bois'),
    gem:`Dignified illustration of two paths diverging at a crossroads in early-1900s America: one labeled "INDUSTRIAL EDUCATION" leading to a workshop, one labeled "FULL CIVIL RIGHTS" leading to a courthouse, a third labeled "BLACK PRIDE" leading to a harbor; sepia engraving style, 4:3, no real person's likeness.` },
  { t:'Rugged Individualism', src:'Herbert Hoover, campaign speech, New York, October 1928', kind:'Document', verbatim:true, q:5,
    ex:'"We were challenged with a peace-time choice between the American system of rugged individualism and a European philosophy of diametrically opposed doctrines—doctrines of paternalism and state socialism."',
    hs:[['"rugged individualism"','Hoover believed self-reliance and voluntary cooperation, not federal relief, drove prosperity.'],['"paternalism and state socialism"','He warned that direct government aid would weaken character and liberty.'],['1928 context','Delivered a year before the crash — this philosophy shaped his response to the Depression.']],
    hp:['Point of view: How would Hoover likely respond to mass unemployment?','Encourage voluntary and local relief rather than large direct federal aid','Immediately create a federal jobs program for millions','Nationalize the banks'],
    ev:['Click the hotspot showing what Hoover feared about government aid.',1], link:LOC('Hoover depression cartoon 1930'),
    gem:`${GEM_STYLE} Scene: a man in a stiff collar labeled "VOLUNTARISM" offers a tiny bandage to a giant cracked figure labeled "DEPRESSION 1930" while a long line of unemployed men waits; caption: "IS IT ENOUGH?".` },
  { t:'Nothing to Fear', src:'Franklin D. Roosevelt, First Inaugural Address, March 4, 1933', kind:'Document', verbatim:true, q:6,
    ex:'"So, first of all, let me assert my firm belief that the only thing we have to fear is fear itself—nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance."',
    hs:[['March 1933','About a quarter of the workforce was unemployed and banks were failing nationwide.'],['"fear itself"','FDR targeted panic — bank runs were spreading the crisis.'],['What came next','A bank holiday, the Emergency Banking Act and the Hundred Days of New Deal laws.']],
    hp:['Purpose: What was FDR trying to accomplish?','Restore public confidence to stop panic such as bank runs','Announce the end of the New Deal','Declare war on Germany'],
    ev:['Click the hotspot describing what FDR did in his first weeks.',2], link:LOC('New Deal cartoon Roosevelt 1933'),
    gem:`${GEM_STYLE} Scene: a crowd at a bank labeled "BANK RUN" while a giant shadow labeled "FEAR" looms; a confident figure labeled "NEW DEAL" shines a lamp that shrinks the shadow; caption: "NOTHING TO FEAR — 1933".` },
  { t:'Signing the Social Security Act', src:'Franklin D. Roosevelt, statement on signing, August 14, 1935', kind:'Document', verbatim:true, q:6,
    ex:'"We can never insure one hundred percent of the population against one hundred percent of the hazards and vicissitudes of life, but we have tried to frame a law which will give some measure of protection to the average citizen and to his family against the loss of a job and against poverty-ridden old age."',
    hs:[['"some measure of protection"','A REFORM: permanent federal insurance rather than temporary relief.'],['"loss of a job"','Unemployment insurance, run with the states.'],['"poverty-ridden old age"','Old-age pensions funded by payroll taxes — still the core of the safety net today.']],
    hp:['Purpose: Which New Deal goal does this law represent?','Reform — a lasting safety net to prevent future hardship','Relief — temporary jobs building dams','Recovery — raising crop prices'],
    ev:['Click the hotspot about pensions for older Americans.',2], link:LOC('Social Security 1935 poster'),
    gem:`Original 1930s-style public-information poster: an older couple and a factory worker under a protective umbrella labeled "SOCIAL SECURITY 1935"; Art Deco lettering; 3:4 portrait; not a copy of any existing poster.` },
  { t:'The Court-Packing Fireside Chat', src:'Franklin D. Roosevelt, radio address, March 9, 1937', kind:'Document', verbatim:true, q:7,
    ex:'"...we have reached the point as a Nation where we must take action to save the Constitution from the Court and the Court from itself."',
    hs:[['"save the Constitution from the Court"','FDR blamed the Court for striking down New Deal laws such as the NIRA (1935).'],['The plan','Add a justice for each one over 70 — up to six new seats.'],['Backlash','Even many Democrats saw a threat to checks and balances; Congress rejected the plan.']],
    hp:['Historical situation: Why did FDR propose changing the Court?','The Court had struck down key New Deal laws','The Court had too few cases','The Constitution required 15 justices'],
    ev:['Click the hotspot explaining why Congress rejected the plan.',2], link:LOC('court packing cartoon 1937'),
    gem:`${GEM_STYLE} Scene: a figure labeled "EXECUTIVE" tries to squeeze extra chairs labeled "NEW JUSTICES" onto a crowded bench labeled "SUPREME COURT" while a scale labeled "CHECKS AND BALANCES" tips; caption: "PACKING THE COURT — 1937".` }
],
u5: [
  { t:'A Date Which Will Live in Infamy', src:'Franklin D. Roosevelt, Address to Congress, December 8, 1941', kind:'Document', verbatim:true, q:0,

    hs:[['"suddenly and deliberately"','Japan struck while negotiations were ongoing; over 2,400 Americans were killed.'],['"Empire of Japan"','Japan sought resources and dominance in Asia; the U.S. had imposed an oil embargo.'],['Result','Congress declared war on Japan that day; Germany and Italy declared war on the U.S. on December 11.']],

  { t:'"We Can Do It!"', src:'J. Howard Miller, Westinghouse war-production poster, 1943', kind:'Poster', verbatim:true, q:2,

  { t:'Murphy\'s Dissent in Korematsu', src:'Justice Frank Murphy, dissenting opinion, 1944', kind:'Document', verbatim:true, q:3,

    hp:['Point of view: How did Justice Murphy view EO 9066?','As racial discrimination beyond the limits of the Constitution','As a necessary and fair military measure','As a law that only applied to Germany'],

    gem:`Respectful 1940s documentary-style illustration of Japanese American families with luggage and identification tags waiting at a train station under guard, muted tones, 4:3, dignified and non-stereotyped, text-free.` },
  { t:'The Truman Doctrine', src:'Harry S. Truman, Address to Congress, March 12, 1947', kind:'Document', verbatim:true, q:6,
    ex:'"I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures."',
    hs:[['"free peoples"','Greece and Turkey faced communist pressure; Truman requested $400 million in aid.'],['"outside pressures"','An unnamed reference to the Soviet Union.'],['Containment','This speech made containment official U.S. policy.']],
    hp:['Purpose: What policy did this speech establish?','Containment of communism through aid to threatened nations','Isolation from European affairs','Immediate war with the Soviet Union'],
    ev:['Click the hotspot naming the countries Truman wanted to help.',0], link:LOC('Truman Doctrine 1947 cartoon'),

function hash(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return ((h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')).toUpperCase(); }

      this.ctx = this.ctx || new (window.AudioContext||window.webkitAudioContext)();
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+when;
      o.type=type; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d+.02);
    }catch(e){}
  },

function modal(html, {full=false, close=true, onClose=null}={}){

/* ============================ MASTERY =============================== */
function itemScore(id){ const s=S.qstat[id]; return s==='first'||s==='mastered' ? 1 : s==='remediated' ? .5 : 0; }
function bmPct(unit, bm){ const qs=unit.qs.filter(q=>q.bm===bm); if(!qs.length) return null; return Math.round(100*qs.reduce((a,q)=>a+itemScore(q.id),0)/qs.length); }
function unitPct(unit){ if(!unit.qs.length) return 0; return Math.round(100*unit.qs.reduce((a,q)=>a+itemScore(q.id),0)/unit.qs.length); }
function award(n, why){ if(n<=0) return; S.tokens+=n; SFX.coin(); toast(`${coin()} +${n} ${t('tokens')} — ${esc(why)}`); save(); renderHUD(); }
function onCorrect(first, mult=1){
  if(first){ S.streak++; S.best=Math.max(S.best,S.streak); S.xp+=100*mult; if(S.streak%3===0) award(1*mult, `${S.streak}× ${t('streak')}`); else if(mult>1) award(1, 'Bounty'); }
  save(); renderHUD();
}
function onMiss(shielded){ if(!shielded) S.streak=0; save(); renderHUD(); }

  $('#pfSave',m).onclick=()=>{ S.student.name=$('#pfName',m).value.trim(); S.student.period=$('#pfPer',m).value.trim(); save(); m.close(); renderHUD(); if(typeof cb==='function') cb(); };
}

   CORE ENGINE: ANTI-CLICK-THROUGH + RETEACH-UNTIL-MASTERY
   =================================================================== */
const LETTERS='ABCDE';
function generic(q,i){ return (q.w && q.w[i-1]) || 'Re-read the stem and compare this choice to the benchmark — it does not match the evidence.'; }

/* Renders one multiple-choice step. Resolves with original option index, 'timeout', or 'skip'. */
function mcStep(host, item, ctx={}){
  return new Promise(resolve=>{
    const order = S.settings.shuffle ? shuffle(item.o.map((_,i)=>i)) : item.o.map((_,i)=>i);
    const timed = typeof S.settings.timer==='number' && ctx.timed!==false;
    let left = timed ? S.settings.timer : 0, iv=null, doneFlag=false;
    const inv = ctx.inv;
    host.innerHTML=`
      <div class="qtop"><div class="row">${ctx.tags||''}</div><div class="row">${ctx.right||''}</div></div>
      ${timed?`<div class="timer"><i style="width:100%"></i></div>`:''}
      ${item.st?`<div class="stim">${esc(item.st)}</div>`:''}
      <div class="stem">${esc(item.s)}</div>
      <div class="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="k">${LETTERS[k]}</span><span>${esc(item.o[oi])}</span></button>`).join('')}</div>
      ${inv?`<div class="pubar" id="pubar"></div>`:''}
      <div class="row" style="margin-top:.7rem">
        ${ctx.allowSkip?`<button class="btn ghost" id="bmk">${t('bookmark')}</button>`:''}
        ${ctx.unit?`<button class="btn ghost" id="cns">${t('consult')}</button>`:''}
      </div><div id="hint"></div>`;
    const finish = v => { if(doneFlag) return; doneFlag=true; clearInterval(iv); resolve(v); };
    $$('.opt',host).forEach(b=>b.onclick=()=>{ if(b.classList.contains('gone')) return; SFX.click(); finish(+b.dataset.i); });
    if(ctx.allowSkip) $('#bmk',host).onclick=()=>finish('skip');
    if(ctx.unit) $('#cns',host).onclick=()=>consultModal(ctx.unit, item);
    if(timed){ const bar=$('.timer i',host); iv=setInterval(()=>{ left--; bar.style.width=(100*left/S.settings.timer)+'%'; if(left<=5&&left>0) SFX.tick(); if(left<=0) finish('timeout'); },1000); }
    if(inv) drawPU();
    function drawPU(){
      const pb=$('#pubar',host); if(!pb) return;
      const P=[['lens','powerup_primary_lens','Primary Source Lens'],['shield','powerup_historian_shield','Historian\'s Shield'],['bounty','powerup_bounty','Double Bounty']];
      pb.innerHTML=P.map(([k,a,l])=>`<button class="pu ${inv.armed&&inv.armed[k]?'armed':''}" data-pu="${k}" ${inv[k]>0?'':'disabled'}><span class="pi">${asset(a)}</span>${l} ×${inv[k]||0}</button>`).join('');
      $$('[data-pu]',pb).forEach(b=>b.onclick=()=>{
        const k=b.dataset.pu; if(inv[k]<=0) return; inv.armed=inv.armed||{};
        if(k==='lens'){
          const live=$$('.opt',host).filter(o=>+o.dataset.i!==0 && !o.classList.contains('gone'));
          if(live.length<=1) return; inv.lens--; pick(live).classList.add('gone');
          const clue=(item.r?item.r[1]:'').split(/[.:;]/)[0]; $('#hint',host).innerHTML=clue?`<div class="note">🔍 <b>Clue:</b> ${esc(clue)}…</div>`:''; SFX.coin();
        } else { if(inv.armed[k]) return; inv[k]--; inv.armed[k]=true; SFX.coin(); toast(k==='shield'?'🛡️ Shield armed — your streak is protected on a miss.':'⚡ Bounty armed — double XP & tokens on a first-try correct.'); }
        drawPU();
      });
    }
  });
}

function markOpts(host, chosen){
  $$('.opt',host).forEach(b=>{ b.disabled=true; const i=+b.dataset.i; if(i===0) b.classList.add('right'); else if(i===chosen) b.classList.add('wrong'); });
}

/* The 5-second (configurable) Read-Lock diagnostic card. */
function diagnostic(host, item, chosen, opts={}){
  return new Promise(resolve=>{
    const secs = S.settings.god ? 0 : (opts.lock ?? S.settings.lock);
    const why = chosen==='timeout' ? t('timeUp') : generic(item, chosen);
    const d=document.createElement('div'); d.className='diag';
    d.innerHTML=`<h3>❌ ${t('whyWrong')}</h3>
      ${chosen!=='timeout'?`<p><b>${t('youChose')}:</b> ${esc(item.o[chosen])}</p>`:''}
      <p>${esc(why)}</p>
      <p class="ok"><b>${t('correctAns')}:</b> ${esc(item.o[0])}</p>
      ${item.r?`<div class="reteach"><h3>📘 Reteach Micro-Lesson: ${esc(item.r[0])}</h3><p>${esc(item.r[1])}</p>${opts.bm?`<p class="small"><span class="tag gold">${esc(opts.bm)}</span> ${esc((typeof BENCHMARK_TEXT!=='undefined'&&BENCHMARK_TEXT[opts.bm])||'')}</p>`:''}</div>`:''}
      <div class="lockbar"><i style="width:100%"></i><span>${t('readLock')}: ${secs}s…</span></div>
      <button class="btn gold big" style="margin-top:.7rem;width:100%" disabled>${opts.btn||t('toRemed')}</button>`;
    host.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'start'});
    const bar=$('.lockbar i',d), lab=$('.lockbar span',d), btn=$('button',d);
    const t0=performance.now();
    const step=()=>{ const el=(performance.now()-t0)/1000, rem=Math.max(0,secs-el);
      bar.style.width=(secs?100*rem/secs:0)+'%'; lab.textContent= rem>0 ? `${t('readLock')}: ${Math.ceil(rem)}s…` : '✔ '+t('cont');
      if(rem>0) requestAnimationFrame(step); else { btn.disabled=false; } };
    step();
    btn.onclick=()=>{ SFX.click(); resolve(); };
  });
}

/* Full mastery item: primary → (claim+evidence) → diagnostic → parallel loop.
   Resolves {correct, firstTry, loops, skipped}. */
async function runItem(host, q, ctx={}){
  const unit = ctx.unit; let loops=0;
  S.lastBm = q.bm || S.lastBm; renderHUD();
  const tags = `<span class="tag gold" title="${esc((typeof BENCHMARK_TEXT!=='undefined'&&BENCHMARK_TEXT[q.bm])||'')}">${esc(q.bm||'')}</span>${q.dok?`<span class="tag">DOK ${q.dok}</span>`:''}${ctx.label?`<span class="tag em">${esc(ctx.label)}</span>`:''}`;
  const chosen = await mcStep(host, q, {...ctx, tags});
  if(chosen==='skip') return {skipped:true};
  let ok = chosen===0, evMiss=false;
  if(ok && q.ev && S.settings.claimEvidence){
    markOpts(host, chosen);
    const box=document.createElement('div'); box.className='good'; box.innerHTML=`<h3>🔒 ${t('claimOk')}</h3><div id="evh"></div>`; host.appendChild(box);
    const evItem={ s:q.ev[0], o:q.ev.slice(1), w:['That detail does not connect to the claim — it is from a different topic or era.','That detail is true but irrelevant to the claim.'] };
    const evHost=$('#evh',box);
    const e = await mcStep(evHost, evItem, {timed:false, tags:`<span class="tag em">${t('evidenceQ')}</span>`});
    if(e!==0){ ok=false; evMiss=true; markOpts(evHost, e); SFX.wrong(); onMiss(ctx.inv&&ctx.inv.armed&&ctx.inv.armed.shield);
      await diagnostic(evHost, {...evItem, r:q.r}, e, {bm:q.bm}); }
    else markOpts(evHost, 0);
  }
  if(ok){
    if(!q.ev || !S.settings.claimEvidence) markOpts(host, 0);
    SFX.right();
    const mult = ctx.inv&&ctx.inv.armed&&ctx.inv.armed.bounty ? 2 : 1;
    if(ctx.inv&&ctx.inv.armed){ ctx.inv.armed.bounty=false; ctx.inv.armed.shield=false; }
    onCorrect(true, mult);
    const g=document.createElement('div'); g.className='good';
    g.innerHTML=`<h3>✅ ${t('nice')} ${mult>1?'⚡×2':''}</h3>${q.r?`<p class="small"><b>${esc(q.r[0])}:</b> ${esc(q.r[1].slice(0,220))}${q.r[1].length>220?'…':''}</p>`:''}<button class="btn em big" style="width:100%">${t('next')} →</button>`;
    host.appendChild(g); g.scrollIntoView({behavior:'smooth',block:'nearest'});
    await new Promise(r=>$('button',g).onclick=r);
    return {correct:true, firstTry:true, loops:0};
  }
  if(!evMiss){
    markOpts(host, chosen); SFX.wrong(); $('.qwrap')?.classList.add('shake');
    const shield = ctx.inv&&ctx.inv.armed&&ctx.inv.armed.shield;
    onMiss(shield); if(shield) toast('🛡️ Historian\'s Shield saved your streak!');
    await diagnostic(host, q, chosen, {bm:q.bm});
  }
  if(ctx.inv&&ctx.inv.armed){ ctx.inv.armed.bounty=false; ctx.inv.armed.shield=false; }
  // Parallel remediation until passed
  const par = q.p || makeParallel(q);
  while(true){
    loops++; S.loops++; save();
    const wrap=document.createElement('div'); host.innerHTML=''; host.appendChild(wrap);
    const pr = await mcStep(wrap, par, {timed:false, unit, tags:`<span class="tag cr">🔁 ${t('remedTitle')}</span><span class="tag gold">${esc(q.bm||'')}</span>`, right:`<span class="small">${t('remedSub')}</span>`});
    if(pr===0){ markOpts(wrap,0); SFX.right();
      const g=document.createElement('div'); g.className='good'; g.innerHTML=`<h3>✅ ${t('remedPassed')}</h3><button class="btn em big" style="width:100%">${t('next')} →</button>`;
      wrap.appendChild(g); await new Promise(r=>$('button',g).onclick=r);
      return {correct:false, firstTry:false, loops};
    }
    markOpts(wrap, pr); SFX.wrong();
    await diagnostic(wrap, {...par, r:q.r}, pr, {bm:q.bm, btn:'🔁 Try the remediation check again (reshuffled)'});
  }
}
function makeParallel(q){
  const ds=q.o.slice(1);
  return { s:'Which statement is historically accurate?', o:[`${q.s} → ${q.o[0]}`, ...ds.map(d=>`${q.s} → ${d}`)], w:ds.map(()=> 'That pairing repeats a trap from the original question.') };
}
function consultModal(unit, item){
  const g=(unit.gallery||[]).find(s=>unit.qs[s.q]===item) || null;
  modal(`<h2>📜 Primary Source & Context</h2>
    ${item.st?`<div class="stim">${esc(item.st)}</div>`:''}
    ${g?`<div class="exhibit"><div class="paper">${esc(g.ex)}</div><div class="plaque"><b>${esc(g.t)}</b> — ${esc(g.src)}</div></div>`:''}

}
