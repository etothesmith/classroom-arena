/* ===================== MODE D: INDEPENDENT GAUNTLET ================= */
function renderGauntlet(m, preset){
  const u = preset ? preset.unit : curUnit();
  const run = { u, t0:Date.now(), loops:0, results:{}, deck:shuffle((u.vocab||[]).map((v,i)=>({v,i,tries:0}))), phase:(u.vocab&&u.vocab.length&&!(preset&&preset.skipDeck))?'deck':'q', response:'' };
  const host = () => $('#gz',m);
  m.innerHTML = `${backBtn()}<div class="qwrap">
    <div class="spread"><h1>🧭 ${t('gauntlet')}</h1><span class="tag gold">${esc(u.title)}</span></div>
    <div class="steps"><div class="step" data-ph="deck">1 · ${t('deck')}</div><div class="step" data-ph="q">2 · ${t('qGauntlet')}</div><div class="step" data-ph="sr">3 · ${t('response')}</div><div class="step" data-ph="rep">4 · ${t('report')}</div></div>
    <div id="gz" class="card"></div></div>`;
  bindBack(m);
  const setStep = ph => { const order=['deck','q','sr','rep']; $$('.step',m).forEach(s=>{ const i=order.indexOf(s.dataset.ph), c=order.indexOf(ph); s.className='step '+(i<c?'ok':i===c?'on':''); }); };
  next();
  function next(){ setStep(run.phase); if(run.phase==='deck') deck(); else if(run.phase==='q') questions(); else if(run.phase==='sr') response(); else report(); }

  function deck(){
    const total=run.deck.length; let seen=0;
    show();
    function show(){
      if(!run.deck.length){ run.phase='q'; return next(); }
      const c=run.deck[0];
      host().innerHTML=`<div class="spread"><h2>📇 ${t('deck')}</h2><span class="small">${Math.min(seen+1,total)} / ${total}${c.tries?' · 🔁 review':''}</span></div>
        <p class="small">${t('flipHint')}</p>
        <div class="flip" id="fc"><div class="in"><div class="f">${esc(c.v[0])}</div><div class="b"><p style="font-size:1.1rem"><b>${esc(c.v[1])}</b></p>${c.v[2]?`<p class="small" style="color:#cfe">⭐ ${esc(c.v[2])}</p>`:''}</div></div></div>
        <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn cr" id="nr" disabled>${t('needReteach')}</button><button class="btn em" id="gi" disabled>${t('gotIt')}</button></div>
        ${S.settings.god?'<p style="text-align:center"><button class="btn ghost" id="skipDeck">⚡ Skip deck (God Mode)</button></p>':''}`;
      const fc=$('#fc',host()); fc.onclick=()=>{ fc.classList.toggle('on'); SFX.click(); $('#nr',host()).disabled=false; $('#gi',host()).disabled=false; };
      $('#gi',host()).onclick=()=>{ run.deck.shift(); seen++; show(); };
      $('#nr',host()).onclick=()=>{ const c2=run.deck.shift(); c2.tries++; if(c2.tries<3) run.deck.push(c2); else seen++; show(); };
      const sk=$('#skipDeck',host()); if(sk) sk.onclick=()=>{ run.deck=[]; show(); };
    }
  }

  async function questions(){
    const thr=S.settings.threshold; const items = preset&&preset.items ? preset.items : u.qs;
    let queue = (S.settings.shuffle?shuffle(items):items.slice()).map(q=>({q, pass:0}));
    const status={}; let attemptedAll=false, firstPass=queue.length, served=0;
    const pct=()=> Math.round(100*items.reduce((a,q)=>a+(status[q.id]==='first'||status[q.id]==='mastered'?1:status[q.id]==='remediated'?.5:0),0)/items.length);
    while(queue.length){
      const cur=queue.shift(); served++; if(served>=firstPass) attemptedAll=true;
      host().innerHTML=`<div class="spread"><b>${t('qGauntlet')}</b><span class="small">${t('mastery')} ${pct()}% · goal ${thr}%</span></div>
        <div class="progress"><i style="width:${pct()}%"></i><span class="thr" style="left:${thr}%"></span></div><div id="qh"></div>`;
      const res = await runItem($('#qh',host()), cur.q, {unit:u, allowSkip:cur.pass===0, label: cur.pass? '🔁 Return visit' : ''});
      if(res.skipped){ queue.push({...cur, pass:cur.pass}); cur.q._bm=true; if(served<=firstPass) firstPass++; continue; }
      if(res.firstTry){ status[cur.q.id] = cur.pass ? 'mastered' : 'first'; }
      else { status[cur.q.id]='remediated'; run.loops+=res.loops; queue.push({q:cur.q, pass:cur.pass+1}); }
      S.qstat[cur.q.id] = (S.qstat[cur.q.id]==='first'||S.qstat[cur.q.id]==='mastered') && status[cur.q.id]==='remediated' ? 'remediated' : status[cur.q.id]; save(); renderHUD();
      if(attemptedAll && pct()>=thr) break;
    }
    run.status=status; run.pct=pct(); run.items=items; run.phase='sr'; award(1,'Gauntlet threshold reached'); next();
  }

  function response(){
    const sr=u.sr||{p:`Explain the most important ideas from ${u.title}. Use specific evidence.`,k:[]};
    host().innerHTML=`<h2>✍️ ${t('response')}</h2><div class="stim">${esc(sr.p)}</div>
      <p class="small">${t('minWords')} · Benchmark keyword checklist:</p><div id="kws">${sr.k.map(k=>`<span class="kw" data-k="${esc(k)}">${esc(k)}</span>`).join('')}</div>
      <textarea id="resp" placeholder="Claim → Evidence → Explanation…">${esc(run.response)}</textarea>
      <div class="spread"><span id="wc" class="small">0 words</span><button class="btn gold" id="sub" disabled>${t('submit')}</button></div>`;
    const ta=$('#resp',host());
    const upd=()=>{ run.response=ta.value; const n=words(ta.value); $('#wc',host()).innerHTML=`<b class="${n>=40?'ok':'bad'}">${n}</b> / 40 words · ${sr.k.filter(k=>ta.value.toLowerCase().includes(k.toLowerCase())).length} keywords`;
      $$('.kw',host()).forEach(s=>s.classList.toggle('hit', ta.value.toLowerCase().includes(s.dataset.k.toLowerCase()))); $('#sub',host()).disabled=n<40; };
    ta.oninput=upd; upd();
    $('#sub',host()).onclick=()=>{ run.phase='rep'; run.t1=Date.now(); award(1,'Historian response submitted'); SFX.fanfare(); next(); };
  }

  function report(){
    const mins=Math.max(1,Math.round((run.t1-run.t0)/60000)), sr=u.sr||{p:'',k:[]};
    const bms=[...new Set(run.items.map(q=>q.bm))];
    const rows=bms.map(bm=>{ const qs=run.items.filter(q=>q.bm===bm); const f=qs.filter(q=>run.status[q.id]==='first').length, ms=qs.filter(q=>run.status[q.id]==='mastered').length;
      const p=Math.round(100*qs.reduce((a,q)=>a+(['first','mastered'].includes(run.status[q.id])?1:run.status[q.id]==='remediated'?.5:0),0)/qs.length);
      return {bm,n:qs.length,f,ms,p}; });
    const code=hash([S.student.name,S.student.period,u.id,run.pct,run.loops,run.t1,run.response.length].join('|')).match(/.{4}/g).join('-');
    const kwHit=sr.k.filter(k=>run.response.toLowerCase().includes(k.toLowerCase()));
    const html=`<div class="report" id="rep">
      <div class="spread"><h1>Classroom Arena — Mastery Report</h1><span class="hash">${code}</span></div>
      ${activeClass()?`<p><b>Classroom:</b> ${esc(activeClass().name)}${activeClass().teacher?' &nbsp; <b>Teacher:</b> '+esc(activeClass().teacher):''}</p>`:''}<p><b>Student:</b> ${esc(S.student.name)} &nbsp; <b>Period:</b> ${esc(S.student.period)} &nbsp; <b>Date:</b> ${new Date(run.t1).toLocaleString()}</p>
      <p><b>Unit:</b> ${esc(u.title)} &nbsp; <b>Time spent:</b> ${mins} min &nbsp; <b>Reteach loops completed:</b> ${run.loops} &nbsp; <b>Final mastery:</b> ${run.pct}% (goal ${S.settings.threshold}%)</p>
      <table><tr><th>Benchmark</th><th>Items</th><th>First-try</th><th>Mastered after reteach</th><th>Mastery</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.bm)}</td><td>${r.n}</td><td>${r.f}</td><td>${r.ms}</td><td><b>${r.p}%</b></td></tr>`).join('')}</table>
      <h3 style="font-family:Georgia,serif;color:#111;margin-top:1rem">Historian Synthesis Response (${words(run.response)} words · keywords: ${esc(kwHit.join(', ')||'none')})</h3>
      <p style="font-style:italic">${esc(sr.p)}</p><p style="white-space:pre-wrap">${esc(run.response)}</p>
      <p style="font-size:.8rem;color:#555">Verification code ${code} is generated from this student's results. Teachers can compare codes to spot copied reports.</p></div>`;
    const text=`CLASSROOM ARENA — MASTERY REPORT\nVerification: ${code}\n${activeClass()?'Classroom: '+activeClass().name+(activeClass().teacher?'  Teacher: '+activeClass().teacher:'')+'\n':''}Student: ${S.student.name}  Period: ${S.student.period}\nUnit: ${u.title}\nDate: ${new Date(run.t1).toLocaleString()}\nTime spent: ${mins} min  Reteach loops: ${run.loops}  Final mastery: ${run.pct}%\n\n`+rows.map(r=>`${r.bm}: ${r.p}% (${r.f} first-try, ${r.ms} after reteach, ${r.n} items)`).join('\n')+`\n\nPrompt: ${sr.p}\n\nResponse (${words(run.response)} words):\n${run.response}\n`;
    host().innerHTML=`<h2>📄 ${t('report')}</h2>${html}
      <div class="row noprint" style="margin-top:1rem"><button class="btn gold" id="pp">${t('printPdf')}</button><button class="btn" id="cp">${t('copyReport')}</button><button class="btn" id="dl">${t('downloadHtml')}</button><button class="btn ghost" data-back>${t('back')}</button></div>
      <p class="small noprint">Submit to Canvas: Print → "Save as PDF", or Copy and paste into the Canvas text box. (If printing is blocked in this preview, use Copy or open the app from your class website.)</p>`;
    bindBack(host());
    $('#pp',host()).onclick=()=>{ const mm=modal(html+'<p class="noprint small">Use your browser\'s print dialog → Save as PDF.</p>'); try{ window.print(); }catch(e){ toast(t('downloadBlocked')); } };
    $('#cp',host()).onclick=()=>copyText(text);
    $('#dl',host()).onclick=()=>download(`mastery_report_${(S.student.name||'student').replace(/\W+/g,'_')}_${u.id}.html`, `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mastery Report</title><style>body{font-family:Georgia,serif;max-width:800px;margin:2rem auto;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px;text-align:left}th{background:#eee}.hash{font-family:monospace;background:#f3f3f3;padding:2px 6px}</style></head><body>${html}</body></html>`,'text/html');
  }
}

/* ======================= MODE B: GALLERY WALK ======================= */
function renderGallery(m){
  const u=curUnit(), st=u.gallery||[];
  const prog = S.galleryDone[u.id] = S.galleryDone[u.id] || [];
  const unlocked = i => S.settings.god || i===0 || prog.includes(i-1);
  m.innerHTML=`${backBtn()}<div class="spread"><h1>🏛️ ${t('gallery')}</h1><span class="tag gold">${esc(u.title)}</span></div>
    <div class="hall"><div class="bg">${asset('gallery_walk_hall')}</div><div class="doors">${st.map((s,i)=>`
      <button class="door ${prog.includes(i)?'done':unlocked(i)?'open':''}" data-st="${i}" ${unlocked(i)?'':'disabled'}>
        <span style="font-size:1.6rem">${prog.includes(i)?'✅':unlocked(i)?'🚪':'🔒'}</span><b>Station ${i+1}</b><span class="small">${unlocked(i)?esc(s.t):t('locked')}</span></button>`).join('')}</div></div>
    <p class="small">Complete each station's 3-step Field Log to unlock the next gallery door. ${prog.length}/${st.length} complete.</p>`;
  bindBack(m);
  $$('[data-st]',m).forEach(b=>b.onclick=()=>{ SFX.click(); station(+b.dataset.st); });

  function station(i){
    const s=st[i], seen=new Set(); let step=0, sel=-1;
    m.innerHTML=`<button class="back" id="toHall">← Gallery Hall</button>
      <div class="grid g2">
        <div><div class="exhibit">${stationImg(u,i)?`<img src="${stationImg(u,i)}" alt="${esc(s.t)}" style="width:100%;display:block;border-radius:4px;margin-bottom:.6rem;cursor:zoom-in" id="exImg">${stationImgKind(u,i)==='original'?'':'<p class="small" style="color:#e8d3a2;margin:.2rem 0 .6rem">⚠️ Teaching illustration created for this class — not a historical artifact.</p>'}`:''}
          <div class="paper" style="white-space:pre-line">${s.kind==='Political Cartoon'&&!s.verbatim?'<b>What the cartoon shows:</b> ':''}${esc(s.ex)}</div>
          <div class="plaque"><b>${esc(s.t)}</b><br>${esc(s.src)} · <i>${esc(s.kind)}</i>${s.verbatim?' · verbatim text':' · description'}${s.link?` · <a href="${esc(s.link)}" target="_blank" rel="noopener" style="color:#F2B441">View the original ↗</a>`:''}</div></div>
          ${isTeacherView()?`<div class="row" style="margin-top:.5rem"><button class="btn" id="tUp">⬆️ Upload original scan</button>${s.gem?'<button class="btn" id="tUpG">⬆️ Upload Gemini art</button><button class="btn ghost" id="tGem">📋 Gemini prompt</button>':''}</div>`:''}
          <div class="hs">${s.hs.map((h,k)=>`<button class="hsb" data-h="${k}">🔍 ${esc(h[0])}</button>`).join('')}</div><div id="nt"></div></div>
        <div class="card"><h2>📝 ${t('fieldLog')}</h2><div class="steps"><div class="step on">${t('s1')}</div><div class="step">${t('s2')}</div><div class="step">${t('s3')}</div></div><div id="log"><p>${t('inspectAll')}</p><p class="small" id="cnt">0 / 3</p></div></div>
      </div>`;
    $('#toHall',m).onclick=()=>renderGallery(m);
    const ei=$('#exImg',m); if(ei) ei.onclick=()=>modal(`<img src="${stationImg(u,i)}" style="width:100%"><p class="small">${esc(s.t)} — ${esc(s.src)}</p>`);
    if($('#tUp',m)) $('#tUp',m).onclick=()=>uploadStationImg(u,i,'original',()=>station(i));
    if($('#tUpG',m)) $('#tUpG',m).onclick=()=>uploadStationImg(u,i,'gemini',()=>station(i));
    if($('#tGem',m)) $('#tGem',m).onclick=()=>{ const mm=modal(`<h2>🎨 Gemini prompt — ${esc(s.t)}</h2><textarea style="min-height:180px">${esc(s.gem)}</textarea><button class="btn gold" id="cpg">📋 Copy</button>`); $('#cpg',mm).onclick=()=>copyText(s.gem); };
    $$('[data-h]',m).forEach(b=>b.onclick=()=>{ SFX.click(); const k=+b.dataset.h; seen.add(k); b.classList.add('seen'); $$('.hsb',m).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=k;
      $('#nt',m).innerHTML=`<div class="note"><b>🔍 ${esc(s.hs[k][0])}</b><br>${esc(s.hs[k][1])}${step===1?`<br><button class="btn gold" id="citeBtn" style="margin-top:.5rem">📌 ${t('cite')}</button>`:''}</div>`;
      if(step===1) $('#citeBtn',m).onclick=cite;
      if(step===0){ $('#cnt',m).textContent=`${seen.size} / 3`; if(seen.size===3) hipp(); } });
    const steps=()=>$$('.step',m);
    const setStep=n=>{ step=n; steps().forEach((e,k)=>e.className='step '+(k<n?'ok':k===n?'on':'')); };
    async function hipp(){
      const log=$('#log',m);
      const item={ s:s.hp[0], o:s.hp.slice(1), w:['Re-read the source citation and date — this choice does not fit the historical situation.','This choice ignores who created the source and why.'] };
      while(true){ const a=await mcStep(log, item, {timed:false, tags:'<span class="tag em">HIPP</span>'}); if(a===0){ markOpts(log,0); SFX.right(); break; }
        markOpts(log,a); SFX.wrong(); await diagnostic(log, item, a, {lock:3, btn:'Try again'}); }
      setStep(1); log.innerHTML=`<div class="note"><b>Step 2 — Evidence Extraction</b><br>${esc(s.ev[0])}<br><span class="small">Select a hotspot on the exhibit, then press "${t('cite')}".</span></div>`;
      $('#nt',m).innerHTML='';
    }
    async function cite(){
      if(sel===s.ev[1]){ SFX.right(); setStep(2); $('#nt',m).innerHTML='';
        const log=$('#log',m); log.innerHTML='<div class="good"><h3>📌 Evidence cited!</h3></div><div id="syn"></div>';
        const q=u.qs[s.q]; await runItem($('#syn',m), q, {unit:u, label:'Benchmark Synthesis'});
        if(!prog.includes(i)) prog.push(i); if(!S.qstat[q.id]) S.qstat[q.id]='remediated'; save();
        SFX.fanfare(); if(prog.length===st.length){ award(2,'Gallery Walk complete'); } else toast('🚪 '+t('nextDoor'));
        renderGallery(m);
      } else { SFX.wrong(); const nb=$('#citeBtn',m); nb.disabled=true; nb.textContent='Not quite — re-read the prompt (3s)…'; await sleep(S.settings.god?0:3000); if(nb.isConnected){ nb.disabled=false; nb.textContent='📌 '+t('cite'); } }
    }
  }
}

/* ======================= MODE C: SUMMIT OF MASTERY ================== */
function renderSummit(m, squadMode){
  const u=curUnit();
  if(!squadMode) return start(['']);
  m.innerHTML=`${backBtn()}<h1>🏔️ ${t('squad')}</h1><div class="card"><p>${t('squadD')}</p>
    <div class="field"><label>Squad member names (2–6, one per line — or table numbers)</label><textarea id="sq" style="min-height:120px">Table 1\nTable 2\nTable 3\nTable 4</textarea></div>
    <button class="btn gold big" id="go">${t('start')}</button></div>`;
  bindBack(m);
  $('#go',m).onclick=()=>{ const names=$('#sq',m).value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6); start(names.length?names:['Squad']); };

  async function start(names){
    const items=S.settings.shuffle?shuffle(u.qs):u.qs.slice(), N=items.length;
    const camps=[1,2,3,4,5].map(k=>Math.ceil(k*N/5));
    const inv={ lens:S.settings.powerups?1:0, shield:S.settings.powerups?1:0, bounty:S.settings.powerups?1:0, medkit:S.settings.powerups&&squadMode?1:0, armed:{} };
    let pos=0, turn=-1, rock=false, queue=items.map(q=>({q,ret:false})), campHit=new Set(), xp=0;
    // trail points (percent coords)
    const pts=[]; for(let i=0;i<=N;i++){ const f=i/N; pts.push([8+f*84 + Math.sin(f*9)*4, 92 - f*80 + Math.cos(f*7)*3]); }
    m.innerHTML=`${backBtn()}<div class="spread"><h1>🏔️ ${squadMode?t('squad'):t('summit')}</h1><span class="tag gold">${esc(u.title)}</span></div>
      <div class="mtn" id="mtn"><div class="bg">${asset('summit_mountain_bg')}</div>
        <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#F2B441" stroke-width=".7" stroke-dasharray="1.6 1.2"/>
        ${camps.map((c,k)=>`<g><circle cx="${pts[c][0]}" cy="${pts[c][1]}" r="2.2" fill="${k===4?'#FF4D9D':'#4DE0B1'}" stroke="#0B0F1F" stroke-width=".5"/></g>`).join('')}</svg>
        ${camps.map((c,k)=>`<span class="tag" style="position:absolute;left:${pts[c][0]}%;top:${pts[c][1]}%;transform:translate(-50%,40%)">${k===4?'🏁 Summit':'⛺ Camp '+(k+1)}</span>`).join('')}
        <div class="climber" id="cl" style="left:${pts[0][0]}%;top:${pts[0][1]}%">${asset('student_avatar')}</div><div class="rock hide" id="rk">🪨</div></div>
      <div class="row" style="margin:.6rem 0" id="sbar"></div><div class="card qwrap" id="sq"></div>`;
    bindBack(m);
    const bar=()=>{ $('#sbar',m).innerHTML=`<span class="chip">📍 Step <b>${pos}</b>/${N}</span><span class="chip">⭐ XP <b>${xp}</b></span>
        ${squadMode?`<span class="chip">🎯 Up now: <b>${esc(names[turn%names.length])}</b></span>`:''}
        ${rock?'<span class="chip" style="border-color:var(--crimson)">🪨 Rockslide! Next correct answer clears it instead of climbing.</span>':''}
        ${squadMode&&S.settings.powerups?`<span class="pu"><span class="pi">${asset('powerup_squad_medkit')}</span>🤝 Squad Medkit ×${inv.medkit}</span>`:''}`; };
    const move=()=>{ const p=pts[pos], c=$('#cl',m); if(!c) return; c.style.left=p[0]+'%'; c.style.top=p[1]+'%'; const r=$('#rk',m); r.classList.toggle('hide',!rock); if(rock){ const q=pts[Math.min(pos+1,N)]; r.style.left=q[0]+'%'; r.style.top=q[1]+'%'; } };
    async function medkitCheck(host){
      const vs=u.vocab||[]; const v=pick(vs); if(!v||vs.length<4){ rock=false; return; }
      const others=shuffle(vs.filter(x=>x!==v)).slice(0,3).map(x=>x[0]);
      const item={s:`Squad Medkit bonus reteach check — which term matches: "${v[1]}"`, o:[v[0],...others], w:others.map(()=> 'That term belongs to a different concept in this unit.')};
      while(true){ const a=await mcStep(host,item,{timed:false,tags:'<span class="tag cr">🤝 Squad Medkit</span>'});
        if(a===0){ SFX.right(); rock=false; toast('🤝 Rockslide cleared by the squad!'); return; }
        markOpts(host,a); SFX.wrong(); await diagnostic(host,item,a,{lock:3,btn:'Try the Medkit check again'}); }
    }
    while(queue.length && pos<N){
      if(!document.body.contains(m) || !$('#sq',m)) return;
      turn++; bar(); move();
      const host=$('#sq',m);
      if(rock && inv.medkit>0){
        host.innerHTML=`<div class="note">🪨 <b>Rockslide!</b> The trail is blocked. Use the <b>Squad Medkit</b> (a quick bonus reteach check) to clear it — or keep climbing and let your next correct answer clear it.</div>
          <div class="row" style="margin-top:.7rem"><button class="btn cr" id="useMk">🤝 Use Squad Medkit</button><button class="btn" id="skipMk">Keep climbing</button></div>`;
        const ch=await new Promise(r=>{ $('#useMk',host).onclick=()=>r(1); $('#skipMk',host).onclick=()=>r(0); });
        if(ch){ inv.medkit--; await medkitCheck(host); bar(); move(); continue; }
      }
      const cur=queue.shift();
      const res=await runItem(host, cur.q, {unit:u, inv: S.settings.powerups?inv:null, label: (squadMode?names[turn%names.length]+' · ':'')+(cur.ret?'🔁 Return visit':'Climb')});
      if(res.firstTry){
        S.qstat[cur.q.id]= cur.ret?'mastered':(S.qstat[cur.q.id]==='remediated'?'mastered':'first'); xp+=100;
        if(rock){ rock=false; toast('🪨 Rockslide cleared!'); } else { pos++; }
        const ci=camps.indexOf(pos); if(ci>-1 && !campHit.has(ci)){ campHit.add(ci); SFX.fanfare();
          if(ci<4){ if(S.settings.powerups){ inv[pick(['lens','shield','bounty'])]++; if(squadMode) inv.medkit++; } award(1,`Basecamp ${ci+1} reached`); } }
      } else { S.qstat[cur.q.id]='remediated'; queue.push({q:cur.q, ret:true}); if(squadMode) rock=true; }
      save(); bar(); move();
      if(!queue.length && pos<N) queue.push({q:pick(items), ret:true});
    }
    if(pos>=N && $('#sq',m)){ award(3,'Summit reached'); SFX.fanfare();
      $('#sq',m).innerHTML=`<div class="good" style="text-align:center"><h2>🏁 SUMMIT OF MASTERY!</h2><p>Every item on this mountain was answered correctly — including every return visit.</p><p>⭐ ${xp} XP</p><button class="btn gold" data-back>${t('back')}</button></div>`; bindBack(m); }
  }
}

/* ======================= MODE A: CLASSROOM JEOPARDY ================= */
function renderJeopardy(m){
  const u=curUnit();
  m.innerHTML=`${backBtn()}<h1>🏆 ${t('jeopardy')}</h1><div class="card">
    <p><b>${esc(u.title)}</b> — ${u.jp?'25 clues ready':'board auto-built from this set'}</p>
    <div class="grid g2"><div class="field"><label>Teams (2–6, one per line)</label><textarea id="tm" style="min-height:140px">Team 1\nTeam 2\nTeam 3\nTeam 4</textarea></div>
    <div><div class="field"><label>Daily Doubles</label><select id="dd"><option value="1">1</option><option value="2" selected>2</option><option value="0">0</option></select></div>
    <div class="field" style="margin-top:.6rem"><label>Clue timer</label><select id="jt"><option value="0">No timer (teacher paced)</option><option value="15">15s</option><option value="30" selected>30s</option><option value="45">45s</option></select></div></div></div>
    <button class="btn gold big" id="go" style="margin-top:.8rem">${t('start')}</button></div>`;
  bindBack(m);
  $('#go',m).onclick=()=>{ const names=$('#tm',m).value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6); start(names.length>1?names:['Team 1','Team 2'], +$('#dd',m).value, +$('#jt',m).value); };

  function start(names, ddN, secs){
    const jp=u.jp||buildJeopardy(u);
    const teams=names.map(n=>({n,s:0})), used=new Set();
    const tiles=[]; for(let c=0;c<5;c++) for(let r=0;r<5;r++) tiles.push(c+'-'+r);
    const dds=new Set(shuffle(tiles.filter(k=>+k.split('-')[1]>=1)).slice(0,ddN));
    board();
    function board(){
      const lead=Math.max(...teams.map(x=>x.s));
      m.innerHTML=`<div class="spread"><button class="back" data-back>${t('back')}</button><div class="row"><button class="btn" id="fj">🎯 Final Jeopardy</button></div></div>
        <div class="jboard">${jp.cats.map(c=>`<div class="jcat">${esc(c)}</div>`).join('')}
        ${[0,1,2,3,4].map(r=>[0,1,2,3,4].map(c=>{ const k=c+'-'+r; return `<button class="jtile ${used.has(k)?'used':''}" data-k="${k}" ${used.has(k)?'disabled':''}>$${(r+1)*100}</button>`; }).join('')).join('')}</div>
        <div class="teams">${teams.map((x,i)=>`<div class="team ${x.s===lead&&lead>0?'lead':''}"><div>${esc(x.n)}</div><div class="sc ${x.s<0?'neg':''}">$${x.s}</div><div class="row" style="justify-content:center"><button class="iconbtn" data-adj="${i}" data-v="-100">−</button><button class="iconbtn" data-adj="${i}" data-v="100">+</button></div></div>`).join('')}</div>`;
      bindBack(m);
      $$('[data-adj]',m).forEach(b=>b.onclick=()=>{ teams[+b.dataset.adj].s+=+b.dataset.v; SFX.click(); board(); });
      $$('.jtile:not(.used)',m).forEach(b=>b.onclick=()=>clue(b.dataset.k));
      $('#fj',m).onclick=final;
      if(used.size===25) $('#fj',m).classList.add('gold');
    }
    function clue(k){
      const [c,r]=k.split('-').map(Number), [q,a]=jp.c[c][r], val=(r+1)*100, isDD=dds.has(k);
      SFX.click();
      const mm=modal(`<div id="cz"></div>`,{full:true, onClose:()=>{ clearInterval(iv); used.add(k); board(); }});
      mm.classList.add('jblue'); const z=$('#cz',mm); let iv=null;
      if(isDD){ SFX.fanfare();
        z.innerHTML=`<div class="clue" style="color:var(--gold)">⭐ DAILY DOUBLE! ⭐</div><div class="grid g2" style="max-width:600px;margin:0 auto"><div class="field"><label>Team</label><select id="ddt">${teams.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join('')}</select></div><div class="field"><label>Wager</label><input id="ddw" type="number" min="5" value="${val}"></div></div><p style="text-align:center"><button class="btn gold big" id="ddgo">Reveal Clue</button></p>`;
        $('#ddgo',z).onclick=()=>{ const ti=+$('#ddt',z).value, max=Math.max(teams[ti].s,500); const w=clamp(+$('#ddw',z).value||0,5,max); show(w,[ti]); };
      } else show(val, teams.map((_,i)=>i));
      function show(v, eligible){
        let left=secs;
        z.innerHTML=`<div class="spread" style="padding-right:3rem"><span class="tag gold">${esc(jp.cats[c])} · $${v}${isDD?' · Daily Double':''}</span>${secs?`<span class="chip">⏱️ <b id="tl">${left}</b>s</span>`:''}</div>
          <div class="clue">${esc(q)}</div>
          <div style="text-align:center"><button class="btn gold big" id="rv">Reveal Answer</button></div><div id="ans"></div>`;
        if(secs){ iv=setInterval(()=>{ left--; const e=$('#tl',z); if(e) e.textContent=left; if(left<=5&&left>0) SFX.tick(); if(left<=0){ clearInterval(iv); SFX.buzz(); } },1000); }
        $('#rv',z).onclick=()=>{ clearInterval(iv); SFX.right(); $('#rv',z).remove();
          const key=a.toLowerCase().split(' (')[0]; const rq=u.qs.find(x=>x.r&&x.r[1].toLowerCase().includes(key));
          const vm=(u.vocab||[]).find(x=>a.toLowerCase().includes(x[0].toLowerCase().split(' (')[0]) || x[0].toLowerCase().includes(a.toLowerCase().split(' (')[0]));
          $('#ans',z).innerHTML=`<div class="clue" style="color:var(--emerald)">${esc(a)}</div>
            <div class="reteach" style="max-width:820px;margin:0 auto"><h3>🎙️ Teacher Debrief / Why It Matters</h3>${vm?`<p><b>${esc(vm[0])}:</b> ${esc(vm[1])}</p><p>⭐ ${esc(vm[2]||'')}</p>`:`${rq?`<p><b>${esc(rq.r[0])}:</b> ${esc(rq.r[1])}</p>`:''}<p>Ask the class: <i>What caused this, who did it affect, and how does it connect to ${esc((u.bms||[])[0]||'the unit')}?</i></p>`}</div>
            <p style="text-align:center;margin-top:1rem" id="stealMsg" class="gold"></p>
            <div class="teams">${teams.map((x,i)=>`<div class="team" ${eligible.includes(i)?'':'style="opacity:.4"'}><b>${esc(x.n)}</b><div class="row" style="justify-content:center;margin-top:.3rem"><button class="btn em" data-ok="${i}" ${eligible.includes(i)?'':'disabled'}>✓ +${v}</button><button class="btn cr" data-no="${i}" ${eligible.includes(i)?'':'disabled'}>✗ −${v}</button></div></div>`).join('')}</div>
            <p style="text-align:center;margin-top:1rem"><button class="btn big" id="cls">Back to Board</button></p>`;
          $$('[data-ok]',z).forEach(b=>b.onclick=()=>{ teams[+b.dataset.ok].s+=v; SFX.coin(); mm.close(); });
          $$('[data-no]',z).forEach(b=>b.onclick=()=>{ const i=+b.dataset.no; teams[i].s-=v; SFX.wrong(); b.disabled=true; b.previousElementSibling.disabled=true; b.closest('.team').style.opacity=.4;
            if(!isDD) $('#stealMsg',z).textContent='🚨 STEAL OPEN — another team may answer!'; });
          $('#cls',z).onclick=()=>mm.close();
        };
      }
    }
    function final(){
      const [cat, q, a]=jp.fj; const mm=modal('<div id="fz"></div>',{full:true,onClose:board}); mm.classList.add('jblue'); const z=$('#fz',mm);
      z.innerHTML=`<div class="clue" style="color:var(--gold)">🎯 FINAL JEOPARDY</div><div class="clue" style="font-size:1.6rem">Category: ${esc(cat)}</div>

function buildJeopardy(u){
  const pool=[...(u.vocab||[]).map(v=>[v[1],v[0]]), ...u.qs.map(q=>[q.s,q.o[0]])];
  const cats=(u.heads&&u.heads.length>=5?u.heads.slice(0,5):['Set A','Set B','Set C','Set D','Set E']);
  const c=[0,1,2,3,4].map(ci=>[0,1,2,3,4].map(r=>pool[(ci*5+r)%Math.max(1,pool.length)]||['(add more content)','—']));
  const last=pool[pool.length-1]||['Final clue','—'];
  return {cats, c, fj:['Final', last[0], last[1]]};
}

function gameShell(title, w, h, onEnd){

  const cv=$('canvas',mm), ctx=cv.getContext('2d'); let raf=0, running=true; const stop=()=>{ running=false; cancelAnimationFrame(raf); };
  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [(p.clientX-r.left)*cv.width/r.width,(p.clientY-r.top)*cv.height/r.height]; };
  return {mm, cv, ctx, pos, loop(fn){ let last=performance.now(); const f=now=>{ if(!running) return; const dt=Math.min(.05,(now-last)/1000); last=now; fn(dt); raf=requestAnimationFrame(f); }; raf=requestAnimationFrame(f); }, stop, end(score,key){ stop(); const hs=Math.max(S.highs[key]||0,score); const nb=score>(S.highs[key]||0); S.highs[key]=hs; save(); SFX.fanfare();
      ctx.fillStyle='rgba(5,6,14,.85)'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle='#F2B441'; ctx.font='32px Bungee, Impact, sans-serif'; ctx.textAlign='center'; ctx.fillText('TIME!  SCORE: '+score, cv.width/2, cv.height/2-10); ctx.fillStyle='#4DE0B1'; ctx.font='20px sans-serif'; ctx.fillText(nb?'NEW HIGH SCORE!':'High score: '+hs, cv.width/2, cv.height/2+28); onEnd&&onEnd(); } };
}
function wrapText(ctx, text, x, y, maxW, lh){ const ws=text.split(' '); let line='', lines=[]; ws.forEach(w=>{ const tl=line?line+' '+w:w; if(ctx.measureText(tl).width>maxW && line){ lines.push(line); line=w; } else line=tl; }); lines.push(line); lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh-(lines.length-1)*lh/2)); }
function sprint(){
  const g=gameShell('🏃 Historian\'s Sprint',900,340), {ctx,cv}=g; const W=900,H=340,GY=280;
  const myths=HISTORY_CLAIMS.filter(c=>!c[1]).map(c=>c[0]);
  const P={x:120,y:GY,vy:0,on:true}; let obs=[], scrolls=[], time=60, score=0, spd=260, spawn=1.2, sc=1.6, flash=0, banner='', bt=0, inv=0;
  const sprite=new Image(); if(GEMINI_ASSETS.student_avatar) sprite.src=GEMINI_ASSETS.student_avatar;
  const jump=e=>{ if(e) e.preventDefault(); if(P.on){ P.vy=-640; P.on=false; SFX.click(); } };
  cv.addEventListener('pointerdown',jump); const kh=e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ jump(e); } }; window.addEventListener('keydown',kh);
  g.mm.addEventListener('remove',()=>window.removeEventListener('keydown',kh));
  g.loop(dt=>{
    time-=dt; if(time<=0){ window.removeEventListener('keydown',kh); return g.end(Math.max(0,Math.round(score)),'sprint'); }
    spd+=dt*6; spawn-=dt; sc-=dt; flash=Math.max(0,flash-dt); bt-=dt; inv=Math.max(0,inv-dt);
    if(spawn<=0){ const myth=pick(myths); obs.push({x:W+20,w:46,h:52+Math.random()*20,label:myth}); banner=myth; bt=2.4; spawn=1.1+Math.random()*1.1; }
    if(sc<=0){ scrolls.push({x:W+20,y:GY-90-Math.random()*90}); sc=1.3+Math.random(); }
    P.vy+=1700*dt; P.y+=P.vy*dt; if(P.y>=GY){ P.y=GY; P.vy=0; P.on=true; }
    obs.forEach(o=>o.x-=spd*dt); scrolls.forEach(s=>s.x-=spd*dt);
    obs=obs.filter(o=>o.x>-80); scrolls=scrolls.filter(s=>s.x>-40 && !s.got);
    obs.forEach(o=>{ if(!o.hit && inv<=0 && P.x+22>o.x && P.x-22<o.x+o.w && P.y>GY-o.h){ o.hit=true; score=Math.max(0,score-15); flash=.4; inv=.8; SFX.wrong(); } else if(!o.passed && o.x+o.w<P.x-22){ o.passed=true; score+=5; } });
    scrolls.forEach(s=>{ if(Math.abs(s.x-P.x)<30 && Math.abs(s.y-(P.y-30))<40){ s.got=true; score+=10; SFX.coin(); } });

    ctx.fillStyle='#1c3a3a'; ctx.fillRect(0,GY,W,H-GY); ctx.fillStyle='#4DE0B1'; ctx.fillRect(0,GY,W,4);
    obs.forEach(o=>{ ctx.fillStyle=o.hit?'#555':'#FF4D9D'; ctx.fillRect(o.x,GY-o.h,o.w,o.h); ctx.fillStyle='#0B0F1F'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText('MYTH',o.x+o.w/2,GY-o.h/2+4); });
    scrolls.forEach(s=>{ ctx.font='28px serif'; ctx.textAlign='center'; ctx.fillText('📜',s.x,s.y); });
    if(sprite.complete && sprite.naturalWidth){ ctx.globalAlpha=inv>0?.5:1; ctx.drawImage(sprite,P.x-26,P.y-56,52,56); ctx.globalAlpha=1; }
    else { ctx.globalAlpha=inv>0?.5:1; ctx.fillStyle='#4DE0B1'; ctx.fillRect(P.x-14,P.y-40,28,30); ctx.fillStyle='#e8b98a'; ctx.beginPath(); ctx.arc(P.x,P.y-50,11,0,7); ctx.fill(); ctx.fillStyle='#F2B441'; ctx.fillRect(P.x-12,P.y-62,24,6); ctx.strokeStyle='#111'; ctx.lineWidth=5; const leg=Math.sin(time*18)*8; ctx.beginPath(); ctx.moveTo(P.x-6,P.y-10); ctx.lineTo(P.x-6-leg,P.y); ctx.moveTo(P.x+6,P.y-10); ctx.lineTo(P.x+6+leg,P.y); ctx.stroke(); ctx.globalAlpha=1; }
    if(bt>0){ ctx.fillStyle='rgba(11,15,31,.8)'; ctx.fillRect(0,0,W,46); ctx.fillStyle='#FF4D9D'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.fillText('JUMP THE MYTH: "'+banner+'"',W/2,28); }
    if(flash>0){ ctx.fillStyle=`rgba(255,77,157,${flash})`; ctx.fillRect(0,0,W,H); }
    $('#gt',g.mm).textContent=Math.ceil(time); $('#gs',g.mm).textContent=Math.round(score);
  });
}
function whack(){
  const g=gameShell('🔨 Whack-a-Fallacy',900,540), {ctx,cv}=g; const W=900,H=540, cols=3, rows=3, cw=W/cols, ch=H/rows;
  let holes=Array.from({length:9},()=>null), time=60, score=0, spawn=.4, fx=[];
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const [x,y]=g.pos(e); const i=Math.floor(y/ch)*cols+Math.floor(x/cw); const h=holes[i]; if(!h||h.hit) return; h.hit=true; h.ttl=.45;
    if(h.fact){ score-=15; SFX.wrong(); fx.push({x:(i%cols+.5)*cw,y:(Math.floor(i/cols)+.5)*ch,txt:'✋ That was a FACT! −15',c:'#FF4D9D',t:1.1}); }
    else { score+=10; SFX.right(); fx.push({x:(i%cols+.5)*cw,y:(Math.floor(i/cols)+.5)*ch,txt:'💥 Myth busted! +10',c:'#4DE0B1',t:1}); } });
  g.loop(dt=>{
    time-=dt; if(time<=0) return g.end(Math.max(0,score),'whack');
    spawn-=dt; if(spawn<=0){ const free=holes.map((h,i)=>h?null:i).filter(i=>i!==null); if(free.length){ const c=pick(HISTORY_CLAIMS); holes[pick(free)]={txt:c[0],fact:c[1],ttl:2.6+Math.max(0,time/60)*1.4,max:0}; } spawn=.55+Math.random()*.6; }
    holes=holes.map(h=>{ if(!h) return null; h.ttl-=dt; return h.ttl>0?h:null; });
    fx.forEach(f=>{ f.t-=dt; f.y-=30*dt; }); fx=fx.filter(f=>f.t>0);
    ctx.fillStyle='#120e24'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<9;i++){ const x=(i%cols)*cw, y=Math.floor(i/cols)*ch; ctx.fillStyle='#1A1430'; ctx.fillRect(x+6,y+6,cw-12,ch-12); ctx.fillStyle='#0B0F1F'; ctx.beginPath(); ctx.ellipse(x+cw/2,y+ch-26,cw/2-30,16,0,0,7); ctx.fill();
      const h=holes[i]; if(h){ ctx.fillStyle=h.hit?(h.fact?'#5a1838':'#155a48'):'#EFEAFB'; ctx.strokeStyle='#F2B441'; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect? ctx.roundRect(x+16,y+14,cw-32,ch-44,10) : ctx.rect(x+16,y+14,cw-32,ch-44); ctx.fill(); ctx.stroke();
        ctx.fillStyle=h.hit?'#fff':'#1A1430'; ctx.font='bold 17px Atkinson Hyperlegible, sans-serif'; ctx.textAlign='center'; wrapText(ctx,h.txt,x+cw/2,y+14+(ch-44)/2+5,cw-56,21); } }
    fx.forEach(f=>{ ctx.globalAlpha=Math.min(1,f.t*1.5); ctx.fillStyle=f.c; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; });
    $('#gt',g.mm).textContent=Math.ceil(time); $('#gs',g.mm).textContent=score;
  });
}

const stationKey=(u,i)=>`gw_${((u.gallery||[])[i]||{}).id||(u.id+'_'+i)}`;
function stationImg(u,i){ return S.assets[stationKey(u,i)]||''; }
function stationImgKind(u,i){ return S.assets[stationKey(u,i)+'_k']||'original'; }
function uploadStationImg(u,i,kind,done){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; if(f.size>2.5e6) toast('Large image — compressing…');
    const r=new FileReader(); r.onload=()=>shrinkImage(r.result, 1400, url=>{ S.assets[stationKey(u,i)]=url; S.assets[stationKey(u,i)+'_k']=kind; if(!save()) toast('⚠️ Browser storage is full — remove some images.'); done&&done(); }); r.readAsDataURL(f); };
  inp.click();
}
function shrinkImage(src, max, cb){
  const img=new Image(); img.onload=()=>{ const k=Math.min(1, max/Math.max(img.width,img.height)); if(k===1 && src.length<900000) return cb(src);
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',.85)); };
  img.onerror=()=>cb(src); img.src=src;
}

/* =====================================================================
   CONTENT EDITOR — each classroom can hide/restore built-in items and add
   its own questions, vocabulary, gallery stations and Jeopardy clues.
   Edits live in classroom.edits[unitId] and are applied on the fly, so
   the built-in Florida database is never altered.
   ===================================================================== */
function applyEdits(u, c){
  const e = c && c.edits && c.edits[u.id];
  const baseGal = (u.gallery||[]).map((g,i)=>({...g, id:g.id||(u.id+'_'+i), qid:g.qid||(u.qs[g.q]||{}).id}));
  if(!e) return baseGal.every((g,i)=>u.gallery[i].id) ? u : {...u, gallery:baseGal};
  const hideQ=new Set(e.hideQ||[]), hideV=new Set(e.hideV||[]), hideG=new Set(e.hideG||[]);
  const qs=u.qs.filter(q=>!hideQ.has(q.id)).concat(e.addQ||[]);
  const vocab=(u.vocab||[]).filter(v=>!hideV.has(v[0])).concat(e.addV||[]);
  const gallery=baseGal.concat(e.addG||[]).filter(g=>!hideG.has(g.id)).map(g=>{
    let qi=qs.findIndex(q=>q.id===g.qid);
    if(qi<0){ const orig=u.qs.find(x=>x.id===g.qid); qi=orig?qs.findIndex(q=>q.bm===orig.bm):-1; }
    return {...g, q:Math.max(0,qi)}; }).filter(()=>qs.length);
  let jp=u.jp;
  if(u.jp && (e.jp||e.jpCats||e.fj)) jp={ cats:u.jp.cats.map((x,i)=>(e.jpCats||{})[i]||x), c:u.jp.c.map((col,ci)=>col.map((cl,ri)=>(e.jp||{})[ci+'-'+ri]||cl)), fj:e.fj||u.jp.fj };
  return {...u, qs, vocab, gallery, jp, bms:[...new Set(qs.map(q=>q.bm))]};
}

function editsFor(id){ const c=activeClass(); if(!c) return null; c.edits=c.edits||{}; return c.edits[id]=c.edits[id]||{}; }

    (e.addQ=e.addQ||[]).push(q); commitEdit(); mm.close(); toast('❓ Question added'); done&&done();

/* =====================================================================
   TEACHER EDITION SIGN-IN + FIRST-RUN TOUR
   A Teacher Edition file carries the classroom plus ONE teacher account
   (email + salted SHA-256 hash — never the plain password). There is no
   server: the sign-in locks this copy of the app; a changed password is
   saved in this browser on this device.
   ===================================================================== */
function sha256Hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=new TextEncoder().encode(str), l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4, l*8>>>0); dv.setUint32(n-8, Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Uint32Array(64);
  const r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0; }
    H=H.map((x,i)=>(x+[a,b,c,d,e,f,g,h][i])>>>0);
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const pwHash=(salt,pw)=>sha256Hex(salt+':'+pw);

const authKey=()=>'arena_auth_'+(S.activeClass||'x');

function startTour(){
  let i=0; const shield=document.createElement('div'), hole=document.createElement('div'), tip=document.createElement('div');
  shield.className='tour-shield'; hole.className='tour-hole'; tip.className='tour-tip';
  document.body.append(shield, hole, tip);
  const end=()=>{ shield.remove(); hole.remove(); tip.remove(); window.removeEventListener('resize',place); if(ACCOUNT){ ACCOUNT.tourDone=true; S.account=ACCOUNT; } S.tourDone=true; save(); };
  let target=null;
  function place(){
    if(target && document.body.contains(target)){ const r=target.getBoundingClientRect(), p=8;
      Object.assign(hole.style,{display:'block',left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});
      const th=tip.offsetHeight, narrow=innerWidth<700, below=r.bottom+16+th<innerHeight, above=r.top-16-th>0;
      tip.style.transform= narrow?'translateX(-50%)':'none';
      if(below||above){ tip.style.left= narrow?'50%':clamp(r.left,12,innerWidth-tip.offsetWidth-12)+'px'; tip.style.top= below?(r.bottom+16)+'px':(r.top-16-th)+'px'; }
      else { tip.style.left= narrow?'50%':(innerWidth-tip.offsetWidth-24)+'px'; tip.style.top=(innerHeight-th-24)+'px'; }
    } else { hole.style.display='none'; Object.assign(tip.style,{left:'50%',top:'50%',transform:'translate(-50%,-50%)'}); }
  }
  async function show(){
    const st=TOUR[i];
    if(st.go){ st.go(); save(); renderTop(); render(); await sleep(60); }
    target = st.sel ? $(st.sel) : null; if(target && st.card) target = target.closest('.card') || target;
    if(target){ if(target.offsetHeight>innerHeight*.6){ const hb=($('#topbar')||{}).offsetHeight||0; window.scrollTo({top:target.getBoundingClientRect().top+scrollY-hb-16, behavior:'instant'}); } else target.scrollIntoView({block:'center',behavior:'instant'}); await sleep(80); }
    tip.innerHTML=`<div class="spread"><span class="tag gold">${i+1} / ${TOUR.length}</span><button class="iconbtn" id="tX" title="Skip tour">✕</button></div>
      <h3 style="margin:.5rem 0 .3rem">${st.title}</h3><p style="margin:0 0 .8rem">${typeof st.body==='function'?st.body():st.body}</p>
      <div class="spread"><button class="btn ghost" id="tB" ${i?'':'disabled'}>← Back</button><button class="btn gold" id="tN">${i===TOUR.length-1?'Finish ✓':'Next →'}</button></div>`;
    place(); SFX.click();
    $('#tX',tip).onclick=end; $('#tB',tip).onclick=()=>{ i--; show(); }; $('#tN',tip).onclick=()=>{ if(i===TOUR.length-1){ end(); SFX.fanfare(); toast('🎉 Tour complete!'); } else { i++; show(); } };
  }
  window.addEventListener('resize',place); show();
}

/* ----------------------------- PARSERS ------------------------------ */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
/* Minimal dependency-free XLSX reader (zip + DecompressionStream). */
async function readXlsx(buf){

  for(let k=0;k<n;k++){ const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl)); files[name]={method,csize,lho}; p+=46+nl+el+cl; }
  const get=async name=>{ const f=files[name]; if(!f) return null; const lnl=dv.getUint16(f.lho+26,true), lel=dv.getUint16(f.lho+28,true); const data=u8.slice(f.lho+30+lnl+lel, f.lho+30+lnl+lel+f.csize);
    if(f.method===0) return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined') throw new Error('This browser cannot unzip .xlsx — save as .csv instead.');
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(ds).text(); };
  const dp=new DOMParser(); const ss=[]; const sst=await get('xl/sharedStrings.xml');
  if(sst){ dp.parseFromString(sst,'application/xml').querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(x=>x.textContent).join(''))); }
  const wb=dp.parseFromString(await get('xl/workbook.xml')||'<x/>','application/xml'); const names=[...wb.querySelectorAll('sheet')].map(s=>s.getAttribute('name'));
  const sheetFiles=Object.keys(files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
  const out=[];
  for(let si=0;si<sheetFiles.length;si++){ const doc=dp.parseFromString(await get(sheetFiles[si]),'application/xml'); const rows=[];
    doc.querySelectorAll('sheetData row').forEach(r=>{ const row=[]; r.querySelectorAll('c').forEach(c=>{ const ref=c.getAttribute('r')||''; const col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1; const tp=c.getAttribute('t'); let v='';
      if(tp==='s') v=ss[+(c.querySelector('v')?.textContent||0)]||''; else if(tp==='inlineStr') v=[...c.querySelectorAll('t')].map(x=>x.textContent).join(''); else v=c.querySelector('v')?.textContent||'';
      row[col>=0?col:row.length]=v; }); rows.push(Array.from(row,x=>x??'')); });
    out.push({name:names[si]||('Sheet'+(si+1)), rows:rows.filter(r=>r.some(c=>String(c).trim()))}); }
  return out;
}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function newUnit(title, source){ return { id:'c'+Date.now().toString(36), custom:true, icon:'🗂️', title, short:title.slice(0,18), era:'Custom', source, bms:[], timeline:[], vocab:[], gallery:[], qs:[], heads:[] }; }
function fromSheets(sheets, base){
  // 1) Quizizz / Wayground template
  for(const sh of sheets){ const hi=sh.rows.findIndex(r=>r.some(c=>norm(c)==='question text')); if(hi<0) continue;
    const H=sh.rows[hi].map(norm), col=n=>H.indexOf(n); const ci={q:col('question text'),type:col('question type'),opt:[1,2,3,4,5].map(k=>col('option '+k)),ans:col('correct answer'),exp:col('answer explanation')};
    const u=newUnit(base,'Quizizz/Wayground spreadsheet'); const openEnded=[]; let skipped=0, conv=0;
    const allAns=[];
    sh.rows.slice(hi+1).forEach(r=>{ const opts=ci.opt.map(k=>k>=0?String(r[k]||'').trim():'').filter(Boolean); if(opts[0]) allAns.push(opts[0]); });
    sh.rows.slice(hi+1).forEach((r,k)=>{
      const qt=String(r[ci.q]||'').trim(); if(!qt) return; const type=norm(r[ci.type]||'multiple choice');
      const opts=ci.opt.map(k2=>k2>=0?String(r[k2]||'').trim():''); const exp=ci.exp>=0?String(r[ci.exp]||'').trim():'';
      const ansRaw=String(r[ci.ans]||'').trim();
      if(type.includes('open')||type.includes('poll')||type.includes('draw')){ openEnded.push(qt); return; }
      let correct='';
      if(type.includes('fill')){ correct=opts.find(Boolean)||ansRaw; const ds=shuffle(allAns.filter(a=>a!==correct)).slice(0,3); if(!correct||ds.length<2){ skipped++; return; } conv++; return u.qs.push(mkQ(u,k,qt,correct,ds,exp)); }
      const nums=ansRaw.split(/[,;]/).map(s=>parseInt(s)).filter(n=>n>=1&&n<=5);
      correct = nums.length ? opts[nums[0]-1] : opts.find(o=>norm(o)===norm(ansRaw));
      if(!correct){ skipped++; return; }
      if(nums.length>1) conv++;
      const ds=opts.filter((o,i)=>o && o!==correct && !nums.includes(i+1)); if(!ds.length){ skipped++; return; }
      u.qs.push(mkQ(u,k,qt,correct,ds,exp));

    if(!u.qs.length) return {error:'Found the Quizizz header row but no usable multiple-choice rows.'};
    u.bms=[u.qs[0].bm]; u.vocab=u.qs.slice(0,12).map(q=>[q.o[0], q.s, q.r[1]]);
    u.sr={p: openEnded[0] || `Explain the most important ideas from "${base}" using specific evidence.`, k: u.qs.slice(0,8).map(q=>q.o[0].split(' ').slice(0,3).join(' '))};
    return {unit:u, msg:`Imported ${u.qs.length} questions from "${base}".`, detail:`<p class="small">${conv?conv+' checkbox/fill-in items converted to multiple choice. ':''}${skipped?skipped+' rows skipped (no answer key). ':''}${openEnded.length?openEnded.length+' open-ended prompts saved as the Historian Response prompt.':''} Jeopardy board and flashcards were auto-built.</p>`};
  }
  // 2) Session results export (find question + accuracy columns on any sheet)
  for(const sh of sheets){ for(let hi=0;hi<Math.min(10,sh.rows.length);hi++){ const H=sh.rows[hi].map(norm);
    const qc=H.findIndex(h=>h.startsWith('question')&&!h.includes('type')&&!h.includes('no')&&!h.includes('number')), ac=H.findIndex(h=>/accuracy|correct|score/.test(h));
    if(qc<0||ac<0) continue;
    const data=sh.rows.slice(hi+1).map(r=>({q:String(r[qc]||'').trim(), acc:parseFloat(String(r[ac]).replace('%',''))})).filter(x=>x.q && !isNaN(x.acc)).map(x=>({...x, acc:x.acc<=1?x.acc*100:x.acc}));
    if(!data.length) continue;
    data.sort((a,b)=>a.acc-b.acc); const worst=data.slice(0,10);
    const known=allUnits().flatMap(u=>u.qs.map(q=>({q,u})));
    const sim=(a,b)=>{ const A=new Set(norm(a).split(' ')), B=new Set(norm(b).split(' ')); const i=[...A].filter(x=>B.has(x)).length; return i/Math.max(1,Math.min(A.size,B.size)); };
    const matched=[], unmatched=[];
    worst.forEach(w=>{ let best=null,bs=0; known.forEach(k=>{ const s=sim(w.q,k.q.s); if(s>bs){bs=s;best=k;} }); if(best&&bs>=.55) matched.push({...w,item:best.q}); else unmatched.push(w); });
    const u=newUnit('Targeted Reteach: '+base,'Session results'); u.icon='🎯';
    u.qs=matched.map(x=>({...x.item, id:x.item.id+'_r'+u.id}));
    const detail=`<table><tr><th>Most-missed question</th><th>Class accuracy</th><th>Matched?</th></tr>${worst.map(w=>`<tr><td>${esc(w.q)}</td><td>${Math.round(w.acc)}%</td><td>${matched.find(x=>x.q===w.q)?'✅':'—'}</td></tr>`).join('')}</table>`;
    if(!u.qs.length) return {msg:`Read ${data.length} result rows. None matched questions in the Arena library yet.`, detail:detail+'<p class="small">Import the original quiz spreadsheet first, then re-import these results to auto-build the reteach game.</p>'};
    u.bms=[...new Set(u.qs.map(q=>q.bm))]; u.vocab=u.qs.map(q=>[q.o[0],q.s,q.r?q.r[1]:'']);
    return {unit:u, msg:`Built a Targeted Reteach Game from the ${u.qs.length} most-missed questions.`, detail};
  } }
  // 3) Two-column term/definition sheet
  const rows=sheets[0]?.rows||[]; if(rows.length&&rows[0].length>=2){ return parseNotes(rows.map(r=>`${r[0]}: ${r[1]}`).join('\n'), base); }

}
function mkQ(u,k,stem,correct,ds,exp){
  const bm=(stem.match(/SS\.\d+\.[A-Z]+\.\d+\.\d+/)||[])[0] || ('Custom · '+u.title.slice(0,24));
  const d=ds.slice(0,3);
  return { id:u.id+'q'+k, bm, dok:2, s:stem, o:[correct,...d], w:d.map(x=>`"${x}" does not match the evidence. ${exp?'Key idea: '+exp:'Compare it carefully to the correct answer.'}`),
    r:['Review', exp || `The correct answer is "${correct}".`],
    p:{ s:'Parallel check — which statement is accurate?', o:[`${stem} → ${correct}`, ...d.map(x=>`${stem} → ${x}`)], w:d.map(()=> 'That pairing repeats a trap from the original question.') } };
}
function fromJSON(j, base){
  if(j && j.qs && j.title){ const u=Object.assign(newUnit(j.title,'JSON set'), j, {id:'c'+Date.now().toString(36), custom:true}); return {unit:u, msg:`Imported "${u.title}" (${u.qs.length} items).`}; }
  const arr=Array.isArray(j)?j:(j.questions||[]); if(!arr.length) return {error:'JSON must be a Classroom Arena set or an array of {question, options, answer}.'};
  const u=newUnit(base,'JSON questions');
  arr.forEach((x,k)=>{ const opts=x.options||x.choices||[]; let a=x.answer; if(typeof a==='number') a=opts[a]; if(typeof a==='string'&&/^[A-E]$/i.test(a)&&opts.length) a=opts['ABCDE'.indexOf(a.toUpperCase())]; if(!a||opts.length<2) return; u.qs.push(mkQ(u,k,x.question||x.q,a,opts.filter(o=>o!==a),x.explanation||'')); });
  u.vocab=u.qs.slice(0,12).map(q=>[q.o[0],q.s,'']); u.bms=[...new Set(u.qs.map(q=>q.bm))];
  return u.qs.length?{unit:u,msg:`Imported ${u.qs.length} questions.`}:{error:'No usable questions in that JSON.'};
}
function parseNotes(text, title){
  const u=newUnit(title,'Study guide / notes'); const lines=text.split(/\r?\n/); let cur=null; const mcs=[], open=[];
  const codes=[...new Set(text.match(/SS\.\d+\.[A-Z]+\.\d+\.\d+/g)||[])];
  for(const raw of lines){ const L=raw.trim(); if(!L) continue;
    let mm;
    if((mm=L.match(/^#{1,6}\s*(.+)/)) || (L.length<60 && L===L.toUpperCase() && /[A-Z]{3}/.test(L) && !/[?:]/.test(L))){ u.heads.push((mm?mm[1]:L).replace(/[:#]/g,'').trim()); cur=null; continue; }
    if((mm=L.match(/^(\d+)[.)]\s+(.+)/))){ cur={s:mm[2],o:[],a:-1}; mcs.push(cur); continue; }
    if(cur && (mm=L.match(/^(\*)?\s*([A-Ea-e])[.)]\s+(.+?)(\s*\*)?$/))){ if(mm[1]||mm[4]) cur.a=cur.o.length; cur.o.push(mm[3].replace(/\*$/,'').trim()); continue; }
    if(cur && (mm=L.match(/^(answer|ans|key)\s*[:\-]\s*([A-Ea-e])\b/i))){ cur.a='ABCDE'.indexOf(mm[2].toUpperCase()); continue; }
    if((mm=L.match(/^[-*•]?\s*([^:–—]{2,70}?)\s*(?::|\s[–—-]\s)\s*(.{6,})$/)) && !/^https?/.test(L)){ u.vocab.push([mm[1].trim(), mm[2].trim(), '']); cur=null; continue; }

    u.qs.push({ id:u.id+'v'+k, bm:codes[k%Math.max(1,codes.length)]||('Custom · '+title.slice(0,24)), dok:1, s:`Which term matches this description? "${v[1]}"`, o:[v[0],...ds.map(x=>x[0])],
      w:ds.map(x=>`"${x[0]}" means: ${x[1]}`), r:[v[0], v[1]],
      p:{ s:`Which description matches "${v[0]}"?`, o:[v[1],...ds.map(x=>x[1])], w:ds.map(x=>`That describes "${x[0]}".`) } }); }); }
  if(!u.qs.length) return {error:'No vocabulary ("Term: definition") or multiple-choice questions (numbered, with A–D choices and a * or "Answer: B") were found.'};
  u.bms=codes.length?codes:[u.qs[0].bm];
  u.sr={ p: open[0] || `Using the key terms from "${title}", explain how these ideas connect. Use at least three terms as evidence.`, k: V.slice(0,10).map(v=>v[0]) };
  return {unit:u, msg:`Built "${title}": ${u.qs.length} quiz items, ${V.length} flashcards, and a 25-clue Jeopardy board.`, detail:`<p class="small">${mcs.length} numbered questions, ${V.length} terms, ${u.heads.length} headings (used as Jeopardy categories)${open.length?', '+open.length+' open review questions (first one used as the written-response prompt)':''}.</p>`};
}

/* ====================== GEMINI GRAPHIC DESIGNER STUDIO =============== */
function geminiStudio(){
  const mm=modal(`<h2>🎨 Gemini Graphic Designer Studio</h2>

    <div class="grid g3" id="slots"></div>
    <details><summary>Developer: copy a GEMINI_ASSETS config</summary><p class="small">Paste into the <code>GEMINI_ASSETS</code> object at the top of the HTML file to bake art in for every device.</p><button class="btn" id="cfg">📋 Copy config</button></details>`);
  draw();
  $('#cfg',mm).onclick=()=>copyText('const GEMINI_ASSETS = '+JSON.stringify(GEMINI_ASSETS,null,2)+';');
  function draw(){
    $('#slots',mm).innerHTML=Object.entries(ASSET_INFO).map(([k,[l,ar]])=>`<div class="asset card"><b>${esc(l)}</b><span class="tag">${k} · ${ar}</span><div class="pv">${asset(k)}</div>
      <label class="btn" style="text-align:center">⬆️ Upload<input type="file" accept="image/*" data-up="${k}" hidden></label>
      <div class="row"><input placeholder="https://… image URL" data-url="${k}" style="flex:1;min-width:0"><button class="btn" data-set="${k}">Set</button></div>
      ${GEMINI_ASSETS[k]?`<button class="btn ghost" data-clr="${k}">Reset to default</button>`:''}</div>`).join('');
    $$('[data-up]',mm).forEach(i=>i.onchange=e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>1.5e6) toast('Large image — it may not save. Try a smaller PNG (< 1.5 MB).',3500); const r=new FileReader(); r.onload=()=>setA(i.dataset.up,r.result); r.readAsDataURL(f); });
    $$('[data-set]',mm).forEach(b=>b.onclick=()=>{ const v=$(`[data-url="${b.dataset.set}"]`,mm).value.trim(); if(v) setA(b.dataset.set,v); });
    $$('[data-clr]',mm).forEach(b=>b.onclick=()=>setA(b.dataset.clr,''));
  }
  function setA(k,v){ GEMINI_ASSETS[k]=v; S.assets[k]=v; save(); if(v&&!S.assets[k]) toast('Saved for this session only (storage full).'); draw(); renderTop(); }
}

/* ===================== TEACHER DEMO & STUDY MODE ==================== */
function renderDemo(m){
  const u=curUnit();
  m.innerHTML=`<div class="spread"><h1>🧪 Teacher Demo & Study Mode</h1>
     <label class="chip" style="cursor:pointer"><input type="checkbox" id="god" ${S.settings.god?'checked':''}> ⚡ God Mode / Instant Preview</label></div>

    ${unitPicker()}
    <div class="card" style="margin-top:1rem"><div class="spread"><h2>${u.icon||''} ${esc(u.title)}</h2>
      <div class="row"><button class="btn" data-pv="gauntlet">▶ Gauntlet</button><button class="btn" data-pv="gallery">▶ Gallery</button><button class="btn" data-pv="summit">▶ Summit</button><button class="btn" data-pv="jeopardy">▶ Jeopardy</button><button class="btn" data-pv="live">▶ Live Q</button><button class="btn" data-pv="squad">▶ Squad</button></div></div>
      <div class="row" style="margin:.6rem 0"><button class="btn gold" data-tab="ex">📖 Curriculum Explorer</button><button class="btn" data-tab="sim">👥 Simulate Live Class (25 AI students)</button></div>
      <div id="dz"></div></div>`;
  bindUnitPicker(m, ()=>render());
  $('#god',m).onchange=e=>{ S.settings.god=e.target.checked; if(S.settings.god) S.tokens=Math.max(S.tokens,99); save(); renderHUD(); };
  $$('[data-pv]',m).forEach(b=>b.onclick=()=>{ const v=b.dataset.pv; if(v==='gallery'&&!(u.gallery||[]).length) return toast('No gallery in this set.'); if(!S.student.name){ S.student.name='Demo Teacher'; S.student.period='T'; } go(v); });
  const tabs=$$('[data-tab]',m); tabs.forEach(b=>b.onclick=()=>{ tabs.forEach(x=>x.classList.toggle('gold',x===b)); b.dataset.tab==='ex'?explorer():sim(); });
  explorer();

  function explorer(){
    const z=$('#dz',m);
    z.innerHTML=`${u.spec?`<div class="grid g3"><div class="card"><h3>🎯 Content Focus</h3><p class="small">${esc(u.spec.focus)}</p></div><div class="card"><h3>📏 Benchmark Clarifications</h3><p class="small">${esc(u.spec.clar)}</p></div><div class="card"><h3>🖼️ Stimulus Attributes</h3><p class="small">${esc(u.spec.stim)}</p></div></div>`:''}
      <details open><summary>✅ Standards alignment (FLDOE 2025 standards / CPALMS)</summary><table><tr><th>Benchmark</th><th>Benchmark statement</th><th>Items</th></tr>${[...new Set(u.qs.map(q=>q.bm))].map(b=>`<tr><td><b>${esc(b)}</b></td><td class="small">${esc(BENCHMARK_TEXT[b]||'Custom / teacher-defined')}</td><td>${u.qs.filter(q=>q.bm===b).length}</td></tr>`).join('')}</table>${(u.gallery||[]).length?`<p class="small">Gallery stations also practice SS.912.A.1.2 (sourcing) and SS.912.A.1.4 (analyzing cartoons and images).</p>`:''}</details>
      ${u.brief?`<details open><summary>📚 Study Guide Briefing</summary><p><b>Causes.</b> ${esc(u.brief.causes)}</p><p><b>Course.</b> ${esc(u.brief.course)}</p><p><b>Consequences.</b> ${esc(u.brief.consequences)}</p><p><b>🌴 Florida connections.</b> ${esc(u.brief.florida)}</p></details>`:''}
      <details><summary>🗓️ Timeline</summary><div class="timeline">${(u.timeline||[]).map(([y,e])=>`<div class="tl"><b>${esc(y)}</b><br>${esc(e)}</div>`).join('')}</div></details>
      <details><summary>📇 Vocabulary (${(u.vocab||[]).length})</summary><table><tr><th>Term</th><th>Definition</th><th>Significance</th></tr>${(u.vocab||[]).map(v=>`<tr><td><b>${esc(v[0])}</b></td><td>${esc(v[1])}</td><td>${esc(v[2]||'')}</td></tr>`).join('')}</table></details>
      <details open><summary>❓ Question Bank with Answers, Distractor Diagnostics, Reteach & Parallels (${u.qs.length})</summary>${u.qs.map((q,i)=>`
        <div class="card" style="margin:.6rem 0"><div class="row"><b>${i+1}.</b><span class="tag gold">${esc(q.bm)}</span><span class="tag">DOK ${q.dok||'—'}</span>${q.ev?'<span class="tag em">Claim + Evidence</span>':''}</div>
        ${q.st?`<div class="stim" style="margin-top:.5rem">${esc(q.st)}</div>`:''}<p><b>${esc(q.s)}</b></p>
        <div class="grid g2"><div><p class="ok">✔ ${esc(q.o[0])}</p>${q.o.slice(1).map((o,k)=>`<p class="small"><span class="bad">✘ ${esc(o)}</span><br>↳ ${esc(generic(q,k+1))}</p>`).join('')}
          ${q.ev?`<p class="small"><b>Evidence lock:</b> ${esc(q.ev[0])} → <span class="ok">${esc(q.ev[1])}</span></p>`:''}</div>
        <div>${q.r?`<div class="reteach" style="margin:0"><h3>📘 ${esc(q.r[0])}</h3><p class="small">${esc(q.r[1])}</p></div>`:''}
          ${q.p?`<p class="small" style="margin-top:.6rem"><b>🔁 Parallel:</b> ${esc(q.p.s)}<br><span class="ok">✔ ${esc(q.p.o[0])}</span></p>`:''}</div></div></div>`).join('')}</details>
      ${(u.gallery||[]).length?`<details><summary>🏛️ Gallery Walk Stations (${u.gallery.length})</summary>${u.gallery.map((g,i)=>`<div class="card" style="margin:.5rem 0"><b>Station ${i+1}: ${esc(g.t)}</b> <span class="small">— ${esc(g.src)}</span><div class="stim" style="margin-top:.4rem">${esc(g.ex)}</div>
        <ul class="small">${g.hs.map((h,k)=>`<li><b>🔍 ${esc(h[0])}</b>${k===g.ev[1]?' ⭐ (evidence answer)':''}: ${esc(h[1])}</li>`).join('')}</ul><p class="small"><b>HIPP:</b> ${esc(g.hp[0])} → <span class="ok">${esc(g.hp[1])}</span><br><b>Synthesis item:</b> #${g.q+1}</p></div>`).join('')}</details>`:''}
      <details><summary>🏆 Jeopardy Answer Key</summary>${(()=>{ const jp=u.jp||buildJeopardy(u); return `<table><tr><th>$</th>${jp.cats.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${[0,1,2,3,4].map(r=>`<tr><td>$${(r+1)*100}</td>${jp.c.map(col=>`<td class="small">${esc(col[r][0])}<br><b class="ok">${esc(col[r][1])}</b></td>`).join('')}</tr>`).join('')}</table><p><b>Final Jeopardy (${esc(jp.fj[0])}):</b> ${esc(jp.fj[1])} → <b class="ok">${esc(jp.fj[2])}</b></p>`; })()}</details>
      ${u.sr?`<details><summary>✍️ Historian Response Prompt</summary><p>${esc(u.sr.p)}</p><p class="small">Keywords: ${esc(u.sr.k.join(', '))}</p></details>`:''}`;
  }

  function sim(){
    const z=$('#dz',m);
    z.innerHTML=`<div class="row"><label class="field"><span class="small">Scope</span><select id="scope"><option value="unit">This unit</option><option value="all">All 6 Florida units</option></select></label><button class="btn gold" id="run">👥 Simulate Live Class (25 AI Students)</button></div><div id="simOut"></div>`;
    $('#run',z).onclick=()=>runSim($('#scope',z).value);
  }
  function runSim(scope){
    const units= scope==='all' ? FLORIDA_US_HISTORY_DB : [u];
    const qs=units.flatMap(x=>x.qs.map(q=>({...q,_u:x})));
    const bms=[...new Set(qs.map(q=>q.bm))];
    const first=['Aaliyah','Mateo','Jayden','Sofia','Elijah','Camila','Noah','Isabella','Liam','Valentina','Josiah','Ava','Gabriel','Mia','Xavier','Zoe','Adrian','Layla','Carlos','Nia','Dylan','Ariana','Jamal','Emily','Diego'];
    const bmDiff=Object.fromEntries(bms.map(b=>[b, Math.random()*.35]));
    const traps={}; const studs=first.map(n=>{ const ab=.45+Math.random()*.5; const rec={n, bm:{}};
      qs.forEach(q=>{ const p=clamp(ab - bmDiff[q.bm] - (q.dok||2)*.06 + .12, .05, .97); const ok=Math.random()<p;
        const r=rec.bm[q.bm]=rec.bm[q.bm]||[0,0]; r[1]++; if(ok) r[0]++; else { const d=1+Math.floor(Math.random()*Math.random()*3); const k=q.id+'|'+d; traps[k]=(traps[k]||0)+1; } });
      return rec; });
    const bmAvg=bms.map(b=>({b, p:Math.round(100*studs.reduce((a,s)=>a+s.bm[b][0]/s.bm[b][1],0)/studs.length)})).sort((a,b)=>a.p-b.p);
    const col=p=>p>=80?'#4DE0B1':p>=60?'#F2B441':'#FF4D9D';
    const topTraps=Object.entries(traps).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,c])=>{ const [id,d]=k.split('|'); const q=qs.find(x=>x.id===id); return {q, d:+d, c}; });
    const shown=bms.slice(0,12);
    $('#simOut',m).innerHTML=`<h2 style="margin-top:1rem">📊 Benchmark Heatmap</h2><p class="small">🟩 ≥80% · 🟨 60–79% · 🟥 &lt;60% ${bms.length>shown.length?`(showing first ${shown.length} of ${bms.length} benchmarks)`:''}</p>
      <div style="overflow-x:auto"><table class="heat"><tr><th>Student</th>${shown.map(b=>`<th style="font-size:.65rem">${esc(b.replace('SS.912.',''))}</th>`).join('')}<th>Avg</th></tr>
      ${studs.map(s=>{ const ps=shown.map(b=>Math.round(100*s.bm[b][0]/s.bm[b][1])); const av=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length); return `<tr><th>${esc(s.n)}</th>${ps.map(p=>`<td style="background:${col(p)}">${p}</td>`).join('')}<td style="background:${col(av)}">${av}</td></tr>`; }).join('')}</table></div>
      <div class="grid g2" style="margin-top:1rem"><div class="card"><h3>🪤 Most Common Misconception Traps</h3>${topTraps.map(x=>`<div style="margin:.5rem 0"><span class="tag cr">${x.c} students</span> <span class="tag gold">${esc(x.q.bm)}</span><p class="small"><b>${esc(x.q.s)}</b><br><span class="bad">Chose: ${esc(x.q.o[x.d])}</span><br>↳ ${esc(generic(x.q,x.d))}</p></div>`).join('')}</div>
      <div class="card"><h3>📉 Bottom 5 Benchmarks</h3>${bmAvg.slice(0,5).map(x=>`<div class="bmbar"><span>${esc(x.b)}</span><span class="meter"><i style="width:${x.p}%;background:${col(x.p)}"></i></span><b>${x.p}%</b></div>`).join('')}
        <button class="btn cr big" id="rr" style="margin-top:.8rem;width:100%">🚀 Launch Reteach Round on Bottom 5 Benchmarks</button></div></div>`;
    $('#rr',m).onclick=()=>{ const low=new Set(bmAvg.slice(0,5).map(x=>x.b)); const items=qs.filter(q=>low.has(q.bm)).map(({_u,...q})=>q);
      const ru=newUnit('Reteach Round: Bottom 5 Benchmarks','Simulated class analytics'); ru.icon='🚀'; ru.qs=items; ru.bms=[...low];
      ru.vocab=units.flatMap(x=>x.vocab).slice(0,0); ru.sr=units[0].sr; ru.timeline=units[0].timeline; ru.brief=units[0].brief;
      S.custom=S.custom.filter(c=>!c.title.startsWith('Reteach Round')); S.custom.push(ru); S.unit=ru.id; S.role='student'; save(); renderTop();
      if(!S.student.name){ S.student.name='Demo Teacher'; S.student.period='T'; } go('gauntlet'); };
  }
}

/* =============================== ROUTER ============================= */
function render(){
  const m=$('#main');
  if(ACCOUNT && !AUTHED) return renderLogin(m);
  renderHUD();
  if(!S.welcomed && !S.classrooms.length && !S.locked) return renderWelcome(m);
  const v=S.view;
  if(v==='gauntlet') return renderGauntlet(m);
  if(v==='gallery') return renderGallery(m);
  if(v==='summit') return renderSummit(m,false);
  if(v==='squad') return renderSummit(m,true);
  if(v==='arcade') return renderArcade(m);
  if(v==='jeopardy') return renderJeopardy(m);
  if(v==='live') return renderLive(m);
  if(S.role==='host') return renderHostHub(m);
  if(S.role==='studio') return renderStudio(m);
  if(S.role==='demo') return renderDemo(m);
  return renderStudentHub(m);
}
function init(){
  const pack=document.getElementById('arenaPack');
  if(pack){ try{ const d=JSON.parse(pack.textContent), cid=(d.classroom||{}).id||'x';
      if(d.account){ // Teacher Edition: keep the teacher's local edits; re-import only if this device has never seen the classroom
        SAVE_KEY='classroom_arena_teacher_'+cid; load();
        if(!S.classrooms.some(x=>x.id===cid)){ importClassPack(pack.textContent, 'teacher'); S.role='studio'; }
        else { S.activeClass=cid; linkClass(); }
        if(!S.account || S.account.issued!==d.account.salt) S.account={...d.account, issued:d.account.salt, tourDone:!!(S.account&&S.account.tourDone)};
        ACCOUNT=S.account; S.locked=false; save();
        try{ AUTHED=sessionStorage.getItem(authKey())==='1'; }catch(e){ AUTHED=false; }
      } else { SAVE_KEY='classroom_arena_student_'+cid; load(); importClassPack(pack.textContent, true); }
    }catch(e){ console.error(e); load(); } }
  else load();
  if(!['hub','arcade'].includes(S.view)) S.view='hub'; // never resume mid-question
  renderTop(); render();
}
document.addEventListener('DOMContentLoaded', init);
